<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Circle — Focus App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<!-- REAL GOOGLE AUTH (optional): fill FIREBASE_CONFIG below to enable it. -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f6fbff;
  --surface:rgba(255,255,255,.88);
  --surface-solid:#fff;
  --ink:#111318;
  --muted:#6f7580;
  --line:rgba(24,28,35,.10);
  --shadow:0 12px 34px rgba(46,61,79,.10);
  --yellow:#ffe638;
  --blue:#72c9ef;
  --cyan:#3cc6ee;
  --purple:#a52fc4;
  --green:#54b95b;
  --pink:#ef2670;
  --lime:#e9ff24;
  --accent:#9f2abf;
  --nav:#ffffffd9;
  --danger:#ef476f;
}
*{
box-sizing:border-box
}
html,body{
margin:0;
min-height:100%;
font-family:"DM Sans",system-ui,sans-serif;
color:var(--ink);
background:var(--bg)
}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.96),transparent 34%),
    radial-gradient(circle at 100% 30%,rgba(184,238,255,.34),transparent 35%),
    #f5fbff;
}
button,input,textarea,select{
font:inherit
}
button{
border:0;
cursor:pointer;
color:inherit
}
img{
max-width:100%;
display:block
}
.hidden{
display:none!important
}
.app-shell{
min-height:100vh;
position:relative
}
.honeycomb{
  position:fixed;
inset:0;
pointer-events:none;
opacity:.28;
z-index:0;
  background-image:
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(60deg,rgba(150,180,205,.08) 25%,transparent 25.5%,transparent 75%,rgba(150,180,205,.08) 75%);
  background-size:80px 140px;
  background-position:0 0,0 0,40px 70px,40px 70px,0 0;
}
.page{
position:relative;
z-index:1
}
button,.card,.subject-card,.nav-item,.bottom-item,.task,.profile-card{
transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease,border-color .22s ease,opacity .22s ease
}
button:active{
transform:scale(.965)!important
}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
outline:3px solid rgba(70,190,240,.30);
outline-offset:2px
}
/* ---------- onboarding ---------- */
.onboarding{
min-height:100vh;
display:grid;
place-items:center;
padding:24px
}
.onboard-card{
width:min(520px,100%);
text-align:center;
min-height:700px;
display:flex;
flex-direction:column;
justify-content:center;
padding:34px 28px
}
.brand-art{
width:210px;
height:160px;
margin:0 auto 28px;
display:grid;
place-items:center;
position:relative
}
.brand-note{
width:150px;
height:110px;
background:#ffe38a;
display:grid;
place-items:center;
font-family:Nunito;
font-size:27px;
line-height:1.05;
transform:rotate(-1.5deg);
box-shadow:0 12px 20px rgba(60,60,30,.08);
border:2px solid #303030;
border-radius:3px;
position:relative;
z-index:2
}
.brand-note:after{
content:"";
position:absolute;
right:-18px;
bottom:-4px;
width:35px;
height:45px;
background:#fff;
border-left:2px solid #303030;
transform:skew(-18deg);
z-index:-1
}
.hedgehog{
position:absolute;
right:35px;
bottom:15px;
font-size:64px;
z-index:3;
filter:drop-shadow(0 4px 2px rgba(0,0,0,.08))
}
.onboard-title{
font-family:Nunito;
font-size:24px;
font-weight:900;
margin:0 0 26px
}
.onboard-copy{
font-size:18px;
line-height:1.55;
color:#343840;
margin:0 auto 38px;
max-width:430px
}
.primary-btn,.secondary-btn{
  width:100%;
height:58px;
border-radius:31px;
font-size:17px;
font-weight:800;
  box-shadow:0 7px 15px rgba(35,42,50,.12);
}
.primary-btn{
background:var(--yellow)
}
.secondary-btn{
background:#73ccef
}
.google-btn{
background:#fff;
border:1px solid rgba(0,0,0,.11);
display:flex;
align-items:center;
justify-content:center;
gap:12px
}
.google-mark{
width:22px;
height:22px;
border-radius:50%;
display:grid;
place-items:center;
font-weight:900;
color:#4285f4
}
.onboard-actions{
display:grid;
gap:16px
}
.form-screen{
width:min(520px,100%);
padding:40px 30px;
min-height:620px;
display:flex;
flex-direction:column
}
.back-btn{
width:42px;
height:42px;
border-radius:50%;
background:#fff;
border:1px solid var(--line);
margin-bottom:34px
}
.form-title{
text-align:center;
font-family:Nunito;
font-size:27px;
margin:0 0 30px
}
.form-help{
font-size:16px;
line-height:1.5;
color:#555c67;
margin:0 0 20px
}
.big-input{
height:78px;
width:100%;
border:2px solid #15171b;
border-radius:24px;
background:#fff;
padding:0 20px;
font-size:21px;
color:#17181c
}
.form-bottom{
margin-top:auto
}
.dots{
display:flex;
justify-content:center;
gap:11px;
margin:0 0 26px
}
.dot{
width:14px;
height:14px;
border-radius:50%;
background:#dfe1e4
}
.dot.active{
background:#20c8df
}
.form-note{
text-align:right;
color:#666;
font-size:13px;
margin-top:7px
}
/* ---------- app ---------- */
.dashboard{
display:grid;
grid-template-columns:230px minmax(0,850px) 300px;
gap:22px;
max-width:1440px;
margin:0 auto;
min-height:100vh;
padding:24px
}
.rail{
position:sticky;
top:24px;
height:calc(100vh - 48px);
display:flex;
flex-direction:column;
padding:14px
}
.brand-mini{
display:flex;
align-items:center;
gap:11px;
padding:12px 8px 22px
}
.brand-logo{
width:42px;
height:42px;
border-radius:13px;
background:#fff;
border:1px solid var(--line);
display:grid;
place-items:center;
font-family:Nunito;
font-weight:900;
font-size:20px;
box-shadow:var(--shadow)
}
.brand-name{
font-family:Nunito;
font-weight:900
}
.brand-sub{
font-size:9px;
color:#7b8490;
letter-spacing:1px;
margin-top:2px
}
.rail-links{
display:grid;
gap:7px
}
.rail-link{
display:flex;
align-items:center;
gap:12px;
padding:13px 14px;
border-radius:15px;
background:transparent;
color:#555d68;
font-weight:700
}
.rail-link.active{
background:#fff;
box-shadow:var(--shadow);
color:#17191e
}
.rail-link .ico{
width:28px;
text-align:center;
font-size:18px
}
.rail-user{
margin-top:auto;
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:10px;
display:flex;
align-items:center;
gap:10px
}
.avatar{
width:42px;
height:42px;
border-radius:13px;
object-fit:cover;
background:#ffe3b2;
display:grid;
place-items:center;
font-size:23px
}
.user-name{
font-weight:800;
font-size:13px
}
.user-sub{
font-size:10px;
color:#8a9098
}
.main{
min-width:0;
padding:4px 0 110px
}
.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin:8px 0 18px
}
.page-title{
font-family:Nunito;
font-size:31px;
font-weight:900;
margin:0
}
.page-sub{
color:#747b85;
font-size:12px;
margin-top:3px
}
.menu-btn{
width:48px;
height:48px;
border-radius:17px;
background:#fff;
border:1px solid var(--line);
font-size:20px;
box-shadow:var(--shadow)
}
.card{
background:var(--surface);
border:1px solid rgba(35,40,50,.10);
border-radius:24px;
box-shadow:var(--shadow);
backdrop-filter:blur(16px)
}
.hero{
padding:20px;
margin-bottom:20px
}
.hero-head{
display:flex;
justify-content:space-between;
align-items:center
}
.hero-label{
font-size:10px;
font-weight:900;
letter-spacing:1.6px;
color:#7a818c
}
.hero-time{
font-family:Nunito;
font-size:54px;
font-weight:900;
letter-spacing:-2px;
margin:8px 0
}
.hero-sub{
font-size:12px;
color:#6d7480
}
.subject-head{
display:flex;
justify-content:space-between;
align-items:center;
margin:22px 2px 10px
}
.section-title{
font-family:Nunito;
font-size:19px;
font-weight:900
}
.add-head{
background:#fff;
border:1px solid var(--line);
border-radius:13px;
padding:8px 12px;
font-weight:800;
font-size:12px
}
.subject-list{
display:grid;
gap:10px
}
.subject-card{
display:grid;
grid-template-columns:64px 1fr auto;
align-items:center;
gap:14px;
padding:9px 12px 9px 9px;
background:#fff;
border:1px solid var(--line);
border-radius:18px;
box-shadow:0 7px 18px rgba(50,60,75,.08)
}
.subject-card:hover{
transform:translateY(-2px);
box-shadow:0 12px 25px rgba(50,60,75,.13)
}
.subject-color{
height:58px;
border-radius:14px;
display:grid;
place-items:center;
color:#fff;
font-size:20px
}
.subject-name{
font-family:Nunito;
font-size:18px;
font-weight:900
}
.subject-time{
font-size:11px;
color:#7a8089;
margin-top:3px
}
.subject-more{
width:38px;
height:38px;
border-radius:12px;
background:#f7f8fa;
font-size:19px
}
.chart-card{
padding:18px;
margin-top:22px
}
.chart-head{
display:flex;
justify-content:space-between;
align-items:end;
margin-bottom:10px
}
.chart-total{
font-family:Nunito;
font-size:23px;
font-weight:900
}
.chart-wrap{
height:250px
}
.activity{
margin-top:22px
}
.activity-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px 17px;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
margin-top:8px
}
.activity-name{
font-weight:800
}
.activity-time{
font-size:11px;
color:#7c828b
}
.right{
padding-top:62px
}
.side-card{
padding:18px;
margin-bottom:12px
}
.side-title{
display:flex;
justify-content:space-between;
align-items:center;
font-family:Nunito;
font-weight:900
}
.task-add{
display:grid;
grid-template-columns:1fr 78px 42px;
gap:7px;
margin-top:14px
}
.task-add input,.task-add button,.profile-field input,.profile-field textarea{
border:1px solid var(--line);
background:#fff;
border-radius:12px;
padding:10px 11px
}
.task-add button{
background:#111;
color:#fff
}
.task{
display:flex;
align-items:center;
gap:10px;
padding:10px 0;
border-bottom:1px solid var(--line)
}
.task:last-child{
border-bottom:0
}
.check{
width:20px;
height:20px;
border-radius:6px;
border:1.5px solid #a7adb6;
background:#fff;
cursor:pointer
}
.task.done .check{
background:#45b95c;
border-color:#45b95c;
color:#fff
}
.task.done .task-text{
text-decoration:line-through;
color:#9ca1a8
}
.target-big{
font-family:Nunito;
font-size:30px;
font-weight:900;
margin:8px 0
}
.progress{
height:10px;
background:#e9ebef;
border-radius:10px;
overflow:hidden
}
.progress i{
display:block;
height:100%;
width:0;
background:linear-gradient(90deg,#58c9ed,#9d36c5);
border-radius:inherit
}
/* ---------- pages ---------- */
.profile-page,.target-page{
display:grid;
gap:14px
}
.profile-card{
padding:18px
}
.profile-top{
display:flex;
align-items:center;
gap:14px
}
.profile-avatar{
width:86px;
height:86px;
border-radius:24px;
object-fit:cover;
background:#ffe6b7;
display:grid;
place-items:center;
font-size:40px
}
.profile-name{
font-family:Nunito;
font-size:22px;
font-weight:900
}
.handle{
font-size:12px;
color:#7c838d
}
.bio{
margin:18px 0 0;
color:#454b55;
line-height:1.5
}
.note{
margin-top:12px;
padding:12px;
border-radius:15px;
background:#fff8a9;
font-size:13px
}
.edit-grid{
display:grid;
gap:10px;
margin-top:16px
}
.profile-field label{
font-size:10px;
font-weight:900;
letter-spacing:1px;
color:#7c838d;
display:block;
margin:0 0 5px 4px
}
.profile-field textarea{
min-height:90px;
resize:vertical
}
.save-btn{
height:48px;
border-radius:15px;
background:#111;
color:#fff;
font-weight:800
}
.upload-btn{
height:44px;
border-radius:13px;
background:#eef8ff;
border:1px solid #cbeefb;
font-weight:800
}
.target-card{
padding:20px
}
.target-input{
height:54px;
border:1px solid var(--line);
border-radius:15px;
padding:0 15px;
width:100%;
background:#fff;
font-size:16px
}
.set-target{
height:48px;
border-radius:15px;
background:var(--yellow);
font-weight:900;
width:100%;
margin-top:10px
}
/* ---------- timer ---------- */
.timer-modal{
position:fixed;
inset:0;
background:rgba(18,21,27,.36);
backdrop-filter:blur(12px);
z-index:50;
display:grid;
place-items:center;
padding:20px
}
.timer-box{
width:min(520px,100%);
background:#fff;
border-radius:32px;
padding:22px;
box-shadow:0 35px 80px rgba(0,0,0,.25);
text-align:center
}
.timer-top{
display:flex;
justify-content:space-between;
align-items:center
}
.timer-subject{
font-family:Nunito;
font-size:21px;
font-weight:900
}
.close-round{
width:42px;
height:42px;
border-radius:50%;
background:#f4f5f7;
font-size:20px
}
.duration-row{
display:flex;
justify-content:center;
gap:8px;
flex-wrap:wrap;
margin:18px 0
}
.duration{
padding:9px 14px;
border-radius:14px;
background:#f1f3f5;
font-weight:800;
font-size:12px
}
.duration.active{
background:#111;
color:#fff
}
.clock{
width:260px;
height:260px;
border-radius:50%;
margin:18px auto;
display:grid;
place-items:center;
background:radial-gradient(circle,#fff 62%,#f0f3f5 63%,#fff 66%);
box-shadow:0 16px 34px rgba(0,0,0,.12);
border:8px solid #f8f9fa
}
.clock strong{
font-family:Nunito;
font-size:42px;
letter-spacing:1px
}
.clock small{
display:block;
color:#888
}
.timer-actions{
display:flex;
justify-content:center;
gap:10px
}
.timer-action{
width:82px;
height:58px;
border-radius:18px;
background:#f2f3f5;
font-weight:900
}
.timer-action.primary{
background:#111;
color:#fff
}
.complete-modal{
position:fixed;
inset:0;
display:grid;
place-items:center;
background:rgba(15,18,23,.20);
backdrop-filter:blur(7px);
z-index:80
}
.complete-box{
width:min(420px,calc(100% - 30px));
background:#fff;
border:2px solid #171717;
border-radius:28px;
padding:25px;
text-align:center;
box-shadow:0 30px 70px rgba(0,0,0,.28);
animation:pop .55s cubic-bezier(.16,1.4,.4,1)
}
.complete-art{
font-size:74px;
animation:bounce .8s ease both
}
.complete-title{
font-family:Nunito;
font-size:27px;
font-weight:900
}
.complete-time{
display:inline-block;
border:2px solid #bd75d1;
border-radius:18px;
padding:8px 18px;
font-weight:900;
color:#702083
}
.complete-actions{
display:grid;
gap:9px;
margin-top:18px
}
.complete-actions button{
height:48px;
border-radius:14px;
background:#e8c5ef;
font-weight:900
}
.complete-actions button:last-child{
background:#fff;
border:1px solid #c98ad8
}
.confetti{
position:fixed;
width:10px;
height:18px;
top:-30px;
z-index:90;
border-radius:5px;
animation:fall 2.7s linear forwards
}
/* ---------- bottom nav ---------- */
.mobile-nav{
display:none
}
.desktop-add{
display:block
}
@keyframes pop{
from{
transform:scale(.78);
opacity:0
}
to{
transform:scale(1);
opacity:1
}
}
@keyframes bounce{
0%{
transform:translateY(18px) scale(.7)
}
65%{
transform:translateY(-8px) scale(1.08)
}
100%{
transform:none
}
}
@keyframes fall{
to{
transform:translate3d(var(--x),110vh,0) rotate(720deg);
opacity:0
}
}
@media(max-width:1050px){
  .dashboard{
grid-template-columns:190px minmax(0,1fr);
max-width:1000px
}
  .right{
display:none
}
}
@media(max-width:700px){
  body{
background:#f7fcff
}
  .dashboard{
display:block;
min-height:100vh;
padding:0 14px 105px
}
  .rail{
display:none
}
  .main{
padding:14px 0 30px
}
  .topbar{
margin:5px 2px 16px
}
.page-title{
font-size:27px
}
.page-sub{
font-size:11px
}
  .menu-btn{
width:44px;
height:44px;
border-radius:15px
}
  .hero{
border-radius:22px;
padding:17px
}
.hero-time{
font-size:44px
}
  .subject-head{
margin-top:20px
}
  .subject-card{
grid-template-columns:62px 1fr auto
}
  .subject-color{
height:56px
}
  .chart-card{
border-radius:22px
}
.chart-wrap{
height:220px
}
  .mobile-nav{
    position:fixed;
display:grid;
grid-template-columns:repeat(4,1fr);
align-items:center;
    left:10px;
right:10px;
bottom:calc(8px + env(safe-area-inset-bottom));
    height:68px;
padding:6px;
border-radius:24px;
background:rgba(255,255,255,.90);
    border:1px solid rgba(30,35,45,.10);
box-shadow:0 14px 38px rgba(39,51,68,.17);
    backdrop-filter:blur(22px);
z-index:30;
}
  .bottom-item{
height:56px;
border-radius:18px;
background:transparent;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
color:#9ca1aa;
font-size:10px;

<div id="app" class="app-shell"></div>

<script>
/* ============================================================
   STUDY CIRCLE — PREMIUM SINGLE FILE APP V2
   ============================================================
   This is a front-end simulation with localStorage persistence.
   You can connect Firebase/Auth/Firestore later without changing
   the UI architecture.
*/

const KEY="study_circle_state_v2";

/* ============================================================
   GOOGLE AUTH SETUP
   ------------------------------------------------------------
   REAL Google sign-in:
   1. Create a Firebase project.
   2. Enable Authentication > Google.
   3. Create a Web App and paste its config below.
   4. For cross-device cloud profile/data, enable Firestore too.
   If the config is left as YOUR_..., the app automatically uses
   the localStorage demo mode, so the UI still works.
============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqaGDE013miUh1CsJajj7_bG6xNLPv0h0",
  authDomain: "study-timer11.firebaseapp.com",
  projectId: "study-timer11",
  storageBucket: "study-timer11.firebasestorage.app",
  messagingSenderId: "72603722283",
  appId: "1:72603722283:web:0132b781b6fb325f25406e",
  measurementId: "G-P6F9YSY860"
};
let firebaseReady = false;
let firebaseUser = null;
let firestore = null;

function initFirebase(){
  try{
    const ready = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_")
      && FIREBASE_CONFIG.authDomain && !FIREBASE_CONFIG.authDomain.startsWith("YOUR_");
    if(!ready || typeof firebase==="undefined") return;
    firebase.initializeApp(FIREBASE_CONFIG);
    firestore = firebase.firestore();
    firebaseReady = true;
    firebase.auth().onAuthStateChanged(async user=>{
      firebaseUser = user || null;
      if(user){
        const ref = firestore.collection("users").doc(user.uid);
        const snap = await ref.get();
        if(snap.exists){
          const cloud = snap.data();
          state = {...state, ...cloud, authUid:user.uid, onboarding:cloud.onboarding || "done"};
          save();
          render();
        }else{
          state.authUid=user.uid;
          state.user.name = state.user.name || user.displayName || "";
          state.user.username = state.user.username || (user.email ? user.email.split("@")[0] : "");
          state.user.dp = state.user.dp || user.photoURL || "";
          save();
        }
      }
    });
  }catch(err){ console.warn("Firebase disabled:", err); }
}
async function syncCloud(){
  if(!firebaseReady || !firebaseUser || !firestore) return;
  try{
    await firestore.collection("users").doc(firebaseUser.uid).set(state,{merge:true});
  }catch(err){ console.warn("Cloud sync failed:", err); }
}
initFirebase();


const DEFAULT_SUBJECTS=[
  {id:crypto.randomUUID(),name:"Bangla",icon:"book-open",color:"#8f36c9",seconds:0},
  {id:crypto.randomUUID(),name:"English",icon:"graduation-cap",color:"#ef2670",seconds:0},
  {id:crypto.randomUUID(),name:"Math",icon:"calculator",color:"#e2c51a",seconds:0}
];

let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  onboarding:"welcome",
  user:{name:"",username:"",birthday:"",dp:"",bio:""},
  note:{text:"",expires:0,bg:"sunset"},
  target:{minutes:480,done:0,date:"",running:false,startedAt:0},
  subjects:DEFAULT_SUBJECTS,
  sessions:[],
  tasks:[],
  filter:"1d",
  theme:"light",
};

if(!state.subjects?.length) state.subjects=DEFAULT_SUBJECTS;
if(!state.note) state.note={text:"",expires:0,bg:"sunset"};
if(!state.note.bg) state.note.bg="sunset";
state.filter=state.filter||"1d";
state.theme=state.theme||localStorage.getItem("study_circle_theme")||"light";

/* migrate older localStorage data */
state.subjects = (state.subjects||[]).map(s=>{
  const map={"📖":"book-open","🎓":"graduation-cap","🧮":"calculator","📚":"book-open"};
  return {...s,icon:map[s.icon]||s.icon||"book-open"};
});
state.target = {...{minutes:480,done:0,date:"",running:false,startedAt:0},...(state.target||{})};

let chart=null;
let timer=null;
let timerState={subject:null,remaining:0,total:0,running:false,startedAt:0};

function save(){localStorage.setItem(KEY,JSON.stringify(state)); syncCloud()}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h)return `${h}h ${m}m`;
  if(m)return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function totalFocus(){return state.subjects.reduce((a,s)=>a+(s.seconds||0),0)}
function todayKey(){return new Date().toISOString().slice(0,10)}
function avatarHTML(size="avatar"){
  if(state.user.dp)return `<img class="${size}" src="${esc(state.user.dp)}" alt="Profile">`;
  return `<div class="${size}">🙂</div>`;
}
function applyTheme(){state.theme="light";localStorage.setItem("study_circle_theme","light");document.documentElement.setAttribute("data-theme","light");}
function toggleTheme(){applyTheme();save();renderApp();}
function themeButton(){return ""}
applyTheme();

/* ---------- onboarding ---------- */
function render(){
  if(state.onboarding!=="done") renderOnboarding();
  else renderApp();
}
function renderOnboarding(){
  const root=document.getElementById("app");
  if(state.onboarding==="welcome"){
    root.innerHTML=`
      <main class="onboarding page">
        <section class="onboard-card">
          <div class="brand-art">
            <div class="brand-note">Study<br>Circle</div>
            <div class="hedgehog">🦔</div>
          </div>
          <h1 class="onboard-title">Study Circle is a focus app to enjoy studying.</h1>
          <p class="onboard-copy">If you are having a hard time finding the motivation to study, or if you feel anxious about studying alone, this is the app for you.</p>
          <div class="onboard-actions">
            <button class="primary-btn google-btn" onclick="startGoogle()">
      <span class="google-mark">G</span><span>Continue with Google</span>
    </button>
    <div class="auth-badge"><span class="google-mark">G</span> Your study data stays saved to your account</div>
          </div>
        </section>
      </main>`;
  }else if(state.onboarding==="welcomeAuth"){
    root.innerHTML=`<main class="onboarding page"><section class="welcome-auth-card"><div class="welcome-auth-icon">S</div><h1>Welcome to Study Circle</h1><p>Your Google account is connected. Let's set up your profile in a few quick steps.</p><button class="primary-btn" onclick="nextOnboard()">Continue</button></section></main>`;
  }else{
    const step=state.onboarding;
    const meta={
      name:{title:"Your name",help:"Tell us what we should call you.",placeholder:"Your name",next:"username"},
      username:{title:"Your username",help:"Choose a username you like. You can change it later.",placeholder:"@username",next:"birthday"},
      birthday:{title:"Your birthday",help:"Add your birthday to complete your profile.",placeholder:"",next:"done"}
    }[step];
    root.innerHTML=`
      <main class="onboarding page">
        <section class="form-screen">
          <button class="back-btn" onclick="goBackOnboard()">‹</button>
          <h1 class="form-title">${meta.title}</h1>
          <p class="form-help">${meta.help}</p>
          ${step==="birthday"
            ? `<input id="onboardInput" class="big-input" type="date" value="${esc(state.user.birthday)}">`
            : `<input id="onboardInput" class="big-input" maxlength="${step==="name"?30:20}" placeholder="${meta.placeholder}" value="${esc(step==="name"?state.user.name:state.user.username)}">`}
          ${step!=="birthday"?`<div class="form-note"><span id="charCount">0</span>/30</div>`:""}
          <div class="form-bottom">
            <div class="dots">
              <i class="dot"></i><i class="dot active"></i><i class="dot"></i><i class="dot"></i>
            </div>
            <button class="primary-btn" onclick="nextOnboard()">Next</button>
          </div>
        </section>
      </main>`;
    const inp=document.getElementById("onboardInput");
    if(inp)inp.addEventListener("input",()=>{const c=document.getElementById("charCount");if(c)c.textContent=inp.value.length});
  }
}
async function startGoogle(){
  if(firebaseReady){
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await firebase.auth().signInWithPopup(provider);
      const u=firebase.auth().currentUser;
      state.authUid=u?.uid||"";state.user.email=u?.email||"";
      state.user.name=state.user.name||u?.displayName||"";
      state.user.dp=state.user.dp||u?.photoURL||"";
      let existing=false;
      if(firestore&&u?.uid){const snap=await firestore.collection("users").doc(u.uid).get();existing=snap.exists&&snap.data()?.onboarding==="done";if(snap.exists){state={...state,...snap.data(),authUid:u.uid};state.user={...state.user,email:u.email||state.user.email,dp:state.user.dp||u.photoURL||""};}}
      state.onboarding=existing?"done":"welcomeAuth";
      save();render();return;
    }catch(err){console.error("Google auth",err);showGoogleChooser(true);return;}
  }
  showGoogleChooser(false);
}
function showGoogleChooser(realFallback){
  document.getElementById("modalHost").innerHTML=`<div class="google-account-modal" onclick="if(event.target===this)closeGoogleChooser()"><section class="google-account-box">
    <div class="google-account-brand"><span class="google-mark">G</span><div><b style="font-size:13px">Sign in with Google</b><div style="font-size:9px;color:#89909a">Study Circle</div></div></div>
    <h2>Choose your Google account</h2><p>Enter the Google email you want to use for your Study Circle account.</p>
    <input id="googleEmailInput" class="google-email-input" type="email" autocomplete="email" placeholder="you@gmail.com" value="${esc(state.user.email||"")}">
    <div class="google-account-actions"><button class="google-cancel" onclick="closeGoogleChooser()">Cancel</button><button class="google-next" onclick="finishGoogleChooser(${!!realFallback})">Continue</button></div>
  </section></div>`;
}
async function finishGoogleChooser(realFallback){
  const email=(document.getElementById("googleEmailInput")?.value||"").trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email))return appAlert("Enter a valid Google email.","Google account");

/* ============================================================
   USERNAME RESERVATION
   ------------------------------------------------------------
   The usernames/{normalizedUsername} document is the unique
   registry. A Firestore transaction checks the document and
   creates it only when no other UID owns it.
   ============================================================ */
async function claimUsername(username){
  const clean=String(username||"").replace(/^@/,"").trim().toLowerCase();
  if(!/^[a-z0-9._-]{3,20}$/.test(clean)) return false;
  if(!firebaseReady || !firestore || !firebaseUser?.uid){
    const localKey="study_circle_username_registry";
    const registry=JSON.parse(localStorage.getItem(localKey)||"{}");
    const owner=registry[clean];
    if(owner && owner!==state.authUid) return false;
    registry[clean]=state.authUid||"local-user";
    localStorage.setItem(localKey,JSON.stringify(registry));
    return true;
  }
  try{
    const uid=firebaseUser.uid;
    const ref=firestore.collection("usernames").doc(clean);
    let claimed=false;
    await firestore.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      if(snap.exists){
        claimed=snap.data()?.uid===uid;
        return;
      }
      tx.set(ref,{uid,username:clean,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      claimed=true;
    });
    return claimed;
  }catch(err){
    console.warn("Username claim failed",err);
    return false;
  }
}

async function releaseUsername(username,uid){
  const clean=String(username||"").replace(/^@/,"").trim().toLowerCase();
  if(!clean) return;
  if(!firebaseReady || !firestore || !uid) return;
  try{
    const ref=firestore.collection("usernames").doc(clean);
    const snap=await ref.get();
    if(snap.exists && snap.data()?.uid===uid) await ref.delete();
  }catch(err){console.warn("Username release failed",err)}
}

/* ============================================================

   ============================================================ */
function periodStart(key){
  if(key==="all") return 0;
  const days=key==="7d"?7:key==="30d"?30:1;
  return Date.now()-days*24*60*60*1000;
}
function filteredSessions(){
  const start=periodStart(state.filter||"1d");
  return (state.sessions||[]).filter(s=>!start || new Date(s.at).getTime()>=start);
}
function filteredFocusTotal(){
  const sessions=filteredSessions();
  if(!sessions.length) return state.filter==="all"?totalFocus():0;
  return sessions.reduce((sum,s)=>sum+(Number(s.seconds)||0),0);
}
function setPeriod(key){
  if(!["1d","7d","30d","all"].includes(key)) key="1d";
  state.filter=key;
  save();
  renderApp();
}
function drawChart(){
  const canvas=document.getElementById("focusChart");
  if(!canvas || typeof Chart==="undefined") return;
  if(chart){try{chart.destroy()}catch(e){}}
  const bySubject={};
  filteredSessions().forEach(s=>{bySubject[s.subject]=(bySubject[s.subject]||0)+(Number(s.seconds)||0)});
  if(state.filter==="all" && !Object.keys(bySubject).length){
    (state.subjects||[]).forEach(s=>{if((s.seconds||0)>0)bySubject[s.name]=s.seconds||0});
  }
  const labels=Object.keys(bySubject);
  const data=labels.map(k=>Math.round((bySubject[k]||0)/60));
  chart=new Chart(canvas,{type:"doughnut",data:{labels,datasets:[{data:data.length?data:[1],backgroundColor:data.length?(state.subjects.map(s=>s.color).filter(Boolean).slice(0,labels.length)):['#dfe5ea'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"72%",plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,font:{size:10}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${ctx.raw} min`}}}}});
}

  </section></div>`;

function updateTimerUI(){
  const clock=document.getElementById("timerClock");
  const progress=document.getElementById("timerProgress");
  if(clock)clock.textContent=fmtClock(timerState.remaining);
  if(progress)progress.style.width=`${Math.max(0,Math.min(100,((timerState.total-timerState.remaining)/Math.max(1,timerState.total))*100))}%`;
}
function toggleTimer(){
  if(!timerState.subject)return;
  if(timerState.running){
    clearInterval(timer);timer=null;timerState.running=false;return;
  }
  timerState.running=true;timerState.startedAt=timerState.startedAt||Date.now();
  timer=setInterval(()=>{
    timerState.remaining=Math.max(0,timerState.remaining-1);updateTimerUI();
    if(timerState.remaining<=0)finishTimer();
  },1000);
  updateTimerUI();
}
function closeTimer(){
  if(timer){clearInterval(timer);timer=null;}
  timerState={subject:null,remaining:0,total:0,running:false,startedAt:0};
  closeAppAlert();
}
function finishTimer(){
  const subject=state.subjects.find(s=>s.id===timerState.subject);
  if(!subject){closeTimer();return;}
  if(timer){clearInterval(timer);timer=null;}
  const studied=Math.max(0,timerState.total-timerState.remaining);
  if(studied>0){
    subject.seconds=(subject.seconds||0)+studied;
    state.sessions.push({id:crypto.randomUUID(),subject:subject.name,seconds:studied,at:new Date().toISOString()});
    state.sessions=state.sessions.slice(-300);
    state.target.done=(state.target.done||0)+studied;
    state.target.date=todayKey();
    save();
  }
  closeTimer();renderApp();
}

      <div class="hero-sub">${fmt(state.target.done)} completed today</div>
      <div class="progress" style="margin:15px 0 18px"><i style="width:${pct}%"></i></div>
      <input id="targetInput" class="target-input" type="number" min="1" max="1440" value="${state.target.minutes}" placeholder="Minutes">
      <button class="set-target" onclick="setTarget()">Set today's target</button><button class="target-start" style="width:100%;height:48px;border-radius:15px;background:${state.target.running?'#ffe8ee':'#111'};color:${state.target.running?'#d52c51':'#fff'};font-weight:900;margin-top:9px" onclick="${state.target.running?'stopTarget()':'startTarget()'}">${state.target.running?'Stop target':'Start target'}</button>
    </section>
    <section class="card target-card">
      <div class="section-title">Tasks</div>
      <div class="task-add"><input id="taskText" placeholder="What will you finish?"><input id="taskTime" type="time"><button onclick="addTask()">＋</button></div>
      <div id="taskList">${renderTasks()}</div>
    </section>`;
}
const NOTE_BG_STYLES={
  sunset:'linear-gradient(135deg,#ffd36b,#ff9f9f)',
  sky:'linear-gradient(135deg,#aee8ff,#b7c8ff)',
  mint:'linear-gradient(135deg,#bff5dc,#8fe8cf)',
  lavender:'linear-gradient(135deg,#dcc7ff,#bda8ff)',
  rose:'linear-gradient(135deg,#ffc2d6,#ff9bb7)',
  midnight:'linear-gradient(135deg,#303846,#161c27)'
};
function noteBgStyle(bg){return NOTE_BG_STYLES[bg]||NOTE_BG_STYLES.sunset}
function noteTextColor(bg){return bg==='midnight'?'#fff':'#18202a'}
function noteAvatarHTML(){
  return state.user.dp?`<img src="${esc(state.user.dp)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:`${esc((state.user.name||'S').charAt(0).toUpperCase())}`;
}
function selectNoteBg(bg){
  if(!NOTE_BG_STYLES[bg])bg='sunset';
  state.note.bg=bg; save();
  const preview=document.getElementById('notePreview');
  if(preview){preview.style.background=noteBgStyle(bg);preview.style.color=noteTextColor(bg)}
  document.querySelectorAll('.note-swatch').forEach(b=>b.classList.toggle('active',b.getAttribute('title')===bg));
}
function updateNotePreview(){
  const input=document.getElementById('noteInput');
  const text=(input?.value||'').slice(0,80);
  const out=document.getElementById('notePreviewText');
  const count=document.getElementById('noteCharCount');
  if(out)out.textContent=text||'Write a little update…';
  if(count)count.textContent=text.length+'/80';
}
function clearNoteDraft(){
  const input=document.getElementById('noteInput');
  if(input){input.value='';updateNotePreview();input.focus()}
}
function saveNote(){
  const input=document.getElementById('noteInput');
  const text=(input?.value||'').trim();
  if(!text)return appAlert('Please write a note first.','24h note');
  state.note={text:text.slice(0,80),expires:Date.now()+24*60*60*1000,bg:state.note.bg||'sunset'};
  save();renderApp();
}

function noteComposerHTML(){
  const noteActive=state.note.text&&state.note.expires>Date.now();
  const noteBg=state.note.bg||'sunset';
  const swatches=[['sunset',''],['sky',''],['mint',''],['lavender',''],['rose',''],['midnight','']];
  return `<div class="note-modal" onclick="if(event.target===this)closeNoteComposer()">
    <section class="note-modal-box">
      <div class="note-modal-top"><div><div class="note-modal-title">Share a note</div><div class="hero-sub" style="margin-top:4px">Only your note text will appear above your profile photo.</div></div><button class="note-modal-close" type="button" onclick="closeNoteComposer()">×</button></div>
      <div id="notePreview" class="note-live-preview" style="background:${noteBgStyle(noteBg)};color:${noteTextColor(noteBg)};margin-bottom:14px"><div class="note-preview-avatar">${noteAvatarHTML()}</div><div class="note-preview-copy"><p id="notePreviewText">${esc(state.note.text||'Write a little update…')}</p></div></div>
      <div class="profile-field"><label>YOUR NOTE</label><div class="note-input-wrap"><input id="noteInput" maxlength="80" value="${esc(state.note.text)}" oninput="updateNotePreview()" placeholder="Write your note..."><span id="noteCharCount" class="note-char">${String(state.note.text||'').length}/80</span></div></div>
      <div><div class="note-style-title">NOTE BACKGROUND</div><div class="note-style-row" style="margin-top:8px">${swatches.map(([bg])=>`<button type="button" class="note-swatch ${noteBg===bg?'active':''}" title="${bg}" aria-label="${bg} note background" onclick="selectNoteBg('${bg}')" style="background:${noteBgStyle(bg)}"></button>`).join('')}</div></div>
      <div class="note-actions"><button class="upload-btn" onclick="saveNote()">${noteActive?'Update note':'Post for 24 hours'}</button><button class="note-clear-btn" type="button" onclick="clearNoteDraft()">Clear</button></div>
    </section>
  </div>`;
}
function openNoteComposer(){const host=document.getElementById('modalHost');if(!host)return;host.innerHTML=noteComposerHTML();setTimeout(()=>document.getElementById('noteInput')?.focus(),30);}
function closeNoteComposer(){const host=document.getElementById('modalHost');if(host)host.innerHTML='';}

function profilePage(){
  const noteActive=state.note.text&&state.note.expires>Date.now();
  const noteTime=noteActive?new Date(state.note.expires).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
  const noteBg=state.note.bg||'sunset';
  const swatches=[['sunset',''],['sky',''],['mint',''],['lavender',''],['rose',''],['midnight','']];
  const noteBubble=noteActive?`<div class="profile-note-bubble" style="background:${noteBgStyle(noteBg)};color:${noteTextColor(noteBg)}" title="${esc(state.note.text)}"><div class="profile-note-only">${esc(state.note.text)}</div></div>`:'';
  return `<div class="topbar"><div><h1 class="page-title">Profile</h1><div class="page-sub">Your study identity, your way.</div></div></div>
  <section class="card profile-card profile-hero">
    <div class="profile-identity">
      <div class="profile-avatar-wrap">${noteBubble}${avatarHTML('profile-avatar')}</div>
      <div class="profile-identity-main"><div class="profile-name">${esc(state.user.name||'Your name')}</div><div class="handle" style="margin-top:3px">@${esc(state.user.username||'username')}</div><div class="hero-sub" style="margin-top:7px">${esc(state.user.bio||'Add a short bio about yourself.')}</div></div>
    </div>
  </section>
  <section class="card profile-card"><div class="section-title">Edit profile</div><div class="edit-grid"><div class="profile-field"><label>NAME</label><input id="editName" value="${esc(state.user.name)}"></div><div class="profile-field"><label>USERNAME • UNIQUE</label><input id="editUsername" value="${esc(state.user.username)}" maxlength="20"></div><div class="profile-field"><label>BIO</label><textarea id="editBio" placeholder="Tell people a little about you...">${esc(state.user.bio)}</textarea></div><div class="profile-field"><label>PROFILE PHOTO</label><div class="photo-picker"><div id="photoPickerPreview" class="photo-picker-preview">${state.user.dp?`<img src="${esc(state.user.dp)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:'🙂'}</div><div class="photo-picker-copy"><b>Choose a profile picture</b><span>Upload from your device • JPG, PNG, WebP</span></div><button type="button" onclick="document.getElementById('dpFile').click()">Choose photo</button><input id="dpFile" class="hidden" type="file" accept="image/*" onchange="previewDP(event)"></div></div><button class="save-btn" onclick="saveProfile()">Save profile</button></div></section>
  <section class="card profile-card note-compact-card">
    <div class="note-compact-copy"><div class="note-compact-dot"></div><div><b>Share a note</b><span>Post a short 24-hour update</span></div></div>
    <button class="note-open-btn" type="button" onclick="openNoteComposer()">Share a note</button>
  </section>
  <section class="card profile-card logout-card"><div class="logout-row"><div class="logout-copy"><b>Account</b><span>Sign out of your Study Circle account on this device.</span></div><button class="logout-btn" onclick="logout()">Log out</button></div></section>`;
}
async function saveProfile(){
  const name=document.getElementById("editName").value.trim()||state.user.name;
  const username=(document.getElementById("editUsername").value.trim().replace(/^@/,"")||state.user.username).toLowerCase();
  if(!/^[a-z0-9._-]{3,20}$/.test(username))return appAlert("Username: 3–20 letters, numbers, dot, underscore or hyphen.","Username");
  if(username!==String(state.user.username||"").toLowerCase()&&!(await claimUsername(username)))return appAlert("That username is already taken. Choose another one.","Username unavailable");
  state.user.name=name;state.user.username=username;state.user.bio=document.getElementById("editBio").value.trim();save();renderApp();
}

function previewDP(e){const file=e.target.files?.[0];if(!file)return;if(file.size>4*1024*1024)return appAlert("Please choose an image smaller than 4MB.","Profile photo");const reader=new FileReader();reader.onload=()=>{state.user.dp=reader.result;const box=document.getElementById("photoPickerPreview");if(box)box.innerHTML=`<img src="${esc(reader.result)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;save()};reader.readAsDataURL(file)}


function setTarget(){
  const input=document.getElementById("targetInput");
  const mins=Math.max(1,Math.min(1440,Number(input?.value)||480));
  if(state.target.running)recordTargetSegment();
  state.target.minutes=mins;state.target.doneSeconds=0;state.target.done=0;state.target.date=todayKey();state.target.running=false;state.target.startedAt=0;state.target.activeSubjectId="";state.target.selectedSubjectIds=[];state.target.subjectStartedAt=0;save();renderApp();
}

/* Better Google-like account chooser when using the local/demo mode. */

render();
</script>
</body>
</html>
