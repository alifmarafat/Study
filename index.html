<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyFlow</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<!-- Firebase compat SDKs: required by the existing single-file auth/Firestore bridge below. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script> 
<style> 
:root{ 
  --bg:#f6fbff; 
  --surface:rgba(255,255,255,.88); 
  --surface-solid:#fff; 
  --ink:#111318; 
  --muted:#6f7580; 
  --line:rgba(24,28,35,.10); 
  --shadow:0 12px 34px rgba(46,61,79,.10); 
  --yellow:#ffe638; 
  --blue:#72c9ef; 
  --cyan:#3cc6ee; 
  --purple:#a52fc4; 
  --green:#54b95b; 
  --pink:#ef2670; 
  --lime:#e9ff24; 
  --accent:#9f2abf; 
  --nav:#ffffffd9; 
  --danger:#ef476f; 
} 
*{box-sizing:border-box} 
html,body{margin:0;min-height:100%;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)} 
body{ 
  overflow-x:hidden; 
  background: 
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.96),transparent 34%), 
    radial-gradient(circle at 100% 30%,rgba(184,238,255,.34),transparent 35%), 
    #f5fbff; 
} 
button,input,textarea,select{font:inherit} 
button{border:0;cursor:pointer;color:inherit} 
img{max-width:100%;display:block} 
.hidden{display:none!important} 
.app-shell{min-height:100vh;position:relative} 
.honeycomb{ 
  position:fixed;inset:0;pointer-events:none;opacity:.28;z-index:0; 
  background-image: 
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)), 
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)), 
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)), 
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)), 
    linear-gradient(60deg,rgba(150,180,205,.08) 25%,transparent 25.5%,transparent 75%,rgba(150,180,205,.08) 75%); 
  background-size:80px 140px; 
  background-position:0 0,0 0,40px 70px,40px 70px,0 0; 
} 
.page{position:relative;z-index:1} 
button,.card,.subject-card,.nav-item,.bottom-item,.task,.profile-card{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease,border-color .22s ease,opacity .22s ease} 
button:active{transform:scale(.965)!important} 
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(70,190,240,.30);outline-offset:2px} 
 
/* ---------- onboarding ---------- */ 
.onboarding{min-height:100vh;display:grid;place-items:center;padding:24px} 
.onboard-card{width:min(520px,100%);text-align:center;min-height:700px;display:flex;flex-direction:column;justify-content:center;padding:34px 28px} 
.brand-art{width:210px;height:160px;margin:0 auto 28px;display:grid;place-items:center;position:relative} 
.brand-note{width:150px;height:110px;background:#ffe38a;display:grid;place-items:center;font-family:Nunito;font-size:27px;line-height:1.05;transform:rotate(-1.5deg);box-shadow:0 12px 20px rgba(60,60,30,.08);border:2px solid #303030;border-radius:3px;position:relative;z-index:2} 
.brand-note:after{content:"";position:absolute;right:-18px;bottom:-4px;width:35px;height:45px;background:#fff;border-left:2px solid #303030;transform:skew(-18deg);z-index:-1} 
.hedgehog{position:absolute;right:35px;bottom:15px;font-size:64px;z-index:3;filter:drop-shadow(0 4px 2px rgba(0,0,0,.08))} 
.onboard-title{font-family:Nunito;font-size:24px;font-weight:900;margin:0 0 26px} 
.onboard-copy{font-size:18px;line-height:1.55;color:#343840;margin:0 auto 38px;max-width:430px} 
.primary-btn,.secondary-btn{ 
  width:100%;height:58px;border-radius:31px;font-size:17px;font-weight:800; 
  box-shadow:0 7px 15px rgba(35,42,50,.12); 
} 
.primary-btn{background:var(--yellow)} 
.secondary-btn{background:#73ccef} 
.google-btn{background:#fff;border:1px solid rgba(0,0,0,.11);display:flex;align-items:center;justify-content:center;gap:12px} 
.google-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#4285f4} 
.onboard-actions{display:grid;gap:16px} 
.form-screen{width:min(520px,100%);padding:40px 30px;min-height:620px;display:flex;flex-direction:column} 
.back-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);margin-bottom:34px} 
.form-title{text-align:center;font-family:Nunito;font-size:27px;margin:0 0 30px} 
.form-help{font-size:16px;line-height:1.5;color:#555c67;margin:0 0 20px} 
.big-input{height:78px;width:100%;border:2px solid #15171b;border-radius:24px;background:#fff;padding:0 20px;font-size:21px;color:#17181c} 
.form-bottom{margin-top:auto} 
.dots{display:flex;justify-content:center;gap:11px;margin:0 0 26px} 
.dot{width:14px;height:14px;border-radius:50%;background:#dfe1e4} 
.dot.active{background:#20c8df} 
.form-note{text-align:right;color:#666;font-size:13px;margin-top:7px} 
 
/* ---------- app ---------- */ 
.dashboard{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:20px;max-width:1440px;margin:0 auto;min-height:100vh;padding:24px} 
.rail{position:sticky;top:24px;height:calc(100vh - 48px);display:flex;flex-direction:column;padding:14px} 
.brand-mini{display:flex;align-items:center;gap:11px;padding:12px 8px 22px} 
.brand-logo{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-family:Nunito;font-weight:900;font-size:20px;box-shadow:var(--shadow)} 
.brand-name{font-family:Nunito;font-weight:900} 
.brand-sub{font-size:9px;color:#7b8490;letter-spacing:1px;margin-top:2px} 
.rail-links{display:grid;gap:7px} 
.rail-link{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;background:transparent;color:#555d68;font-weight:700} 
.rail-link.active{background:#fff;box-shadow:var(--shadow);color:#17191e} 
.rail-link .ico{width:28px;text-align:center;font-size:18px} 
.rail-user{margin-top:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px} 
.avatar{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#ffe3b2;display:grid;place-items:center;font-size:23px} 
.user-name{font-weight:800;font-size:13px}.user-sub{font-size:10px;color:#8a9098} 
.main{min-width:0;padding:4px 0 110px} 
.topbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px} 
.page-title{font-family:Nunito;font-size:31px;font-weight:900;margin:0} 
.page-sub{color:#747b85;font-size:12px;margin-top:3px} 
.menu-btn{width:48px;height:48px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:20px;box-shadow:var(--shadow)} 
.card{background:var(--surface);border:1px solid rgba(35,40,50,.10);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px)} 
.hero{padding:20px;margin-bottom:20px} 
.hero-head{display:flex;justify-content:space-between;align-items:center} 
.hero-label{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#7a818c} 
.hero-time{font-family:Nunito;font-size:54px;font-weight:900;letter-spacing:-2px;margin:8px 0} 
.hero-sub{font-size:12px;color:#6d7480} 
.subject-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px} 
.section-title{font-family:Nunito;font-size:19px;font-weight:900} 
.add-head{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 12px;font-weight:800;font-size:12px} 
.subject-list{display:grid;gap:10px} 
.subject-card{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;padding:9px 12px 9px 9px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 18px rgba(50,60,75,.08)} 
.subject-card:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(50,60,75,.13)} 
.subject-color{height:58px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:20px} 
.subject-name{font-family:Nunito;font-size:18px;font-weight:900} 
.subject-time{font-size:11px;color:#7a8089;margin-top:3px} 
.subject-more{width:38px;height:38px;border-radius:12px;background:#f7f8fa;font-size:19px} 
.chart-card{padding:18px;margin-top:22px} 
.chart-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px} 
.chart-total{font-family:Nunito;font-size:23px;font-weight:900} 
.chart-wrap{height:250px} 
.activity{margin-top:22px} 
.activity-row{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:8px} 
.activity-name{font-weight:800}.activity-time{font-size:11px;color:#7c828b} 
.right{padding-top:62px;width:100%;min-width:0} 
.side-card{padding:16px;margin-bottom:12px;border-radius:22px} 
.side-title{display:flex;justify-content:space-between;align-items:center;font-family:Nunito;font-weight:900;font-size:15px} 
.right .side-card .target-big{font-size:26px;margin:6px 0 4px} 
.right .side-card .hero-sub{font-size:11px} 
.right .side-card .progress{margin:10px 0 12px} 
.right .side-card .target-start{height:42px;border-radius:13px;font-size:13px;margin-top:4px} 
.right .task-add{margin-top:12px} 
.right .task{padding:9px 0} 
.right .task-text{font-size:11px!important} 
.task-add{display:grid;grid-template-columns:minmax(0,1fr) 72px 40px;gap:6px;margin-top:14px} 
.task-add input,.task-add button,.profile-field input,.profile-field textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px} 
.task-add button{background:#111;color:#fff} 
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)} 
.task:last-child{border-bottom:0} 
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid #a7adb6;background:#fff;cursor:pointer} 
.task.done .check{background:#45b95c;border-color:#45b95c;color:#fff}.task.done .task-text{text-decoration:line-through;color:#9ca1a8} 
.target-big{font-family:Nunito;font-size:30px;font-weight:900;margin:8px 0} 
.progress{
  height:10px;background:rgba(255,255,255,.38);border-radius:999px;overflow:hidden;
  border:1px solid rgba(255,255,255,.45);
  box-shadow:inset 0 1px 2px rgba(40,50,70,.04);
  position:relative;
}
.progress > i{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,#7dd3f0 0%,#8eb6ff 50%,#c084fc 100%);
  box-shadow:none;
  position:relative;overflow:hidden;
  transition:width .4s ease-out;
}
.progress > i::before,
.progress > i::after{
  display:none !important;
  content:none !important;
  animation:none !important;
}
.progress.live > i{
  transition:width .35s linear;
}
 
 
/* ---------- pages ---------- */ 
.profile-page,.target-page{display:grid;gap:14px} 
.profile-card{padding:18px} 
.profile-top{display:flex;align-items:center;gap:14px} 
.profile-avatar{width:86px;height:86px;border-radius:24px;object-fit:cover;background:#ffe6b7;display:grid;place-items:center;font-size:40px} 
.profile-name{font-family:Nunito;font-size:22px;font-weight:900}.handle{font-size:12px;color:#7c838d} 
.bio{margin:18px 0 0;color:#454b55;line-height:1.5} 
.note{margin-top:12px;padding:12px;border-radius:15px;background:#fff8a9;font-size:13px} 
.edit-grid{display:grid;gap:10px;margin-top:16px} 
.profile-field label{font-size:10px;font-weight:900;letter-spacing:1px;color:#7c838d;display:block;margin:0 0 5px 4px} 
.profile-field textarea{min-height:90px;resize:vertical} 
.save-btn{height:48px;border-radius:15px;background:#111;color:#fff;font-weight:800} 
.upload-btn{height:44px;border-radius:13px;background:#eef8ff;border:1px solid #cbeefb;font-weight:800} 
.target-card{padding:20px} 
.target-input{height:54px;border:1px solid var(--line);border-radius:15px;padding:0 15px;width:100%;background:#fff;font-size:16px} 
.set-target{height:48px;border-radius:15px;background:var(--yellow);font-weight:900;width:100%;margin-top:10px} 
 
/* ---------- timer ---------- */ 
.timer-modal{position:fixed;inset:0;background:rgba(18,21,27,.36);backdrop-filter:blur(12px);z-index:50;display:grid;place-items:center;padding:20px} 
.timer-box{width:min(520px,100%);background:#fff;border-radius:32px;padding:22px;box-shadow:0 35px 80px rgba(0,0,0,.25);text-align:center} 
.timer-top{display:flex;justify-content:space-between;align-items:center}.timer-subject{font-family:Nunito;font-size:21px;font-weight:900} 
.close-round{width:42px;height:42px;border-radius:50%;background:#f4f5f7;font-size:20px} 
.duration-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0} 
.duration{padding:9px 14px;border-radius:14px;background:#f1f3f5;font-weight:800;font-size:12px}.duration.active{background:#111;color:#fff} 
.clock{width:260px;height:260px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:radial-gradient(circle,#fff 62%,#f0f3f5 63%,#fff 66%);box-shadow:0 16px 34px rgba(0,0,0,.12);border:8px solid #f8f9fa} 
.clock strong{font-family:Nunito;font-size:42px;letter-spacing:1px}.clock small{display:block;color:#888} 
.timer-actions{display:flex;justify-content:center;gap:10px}.timer-action{width:82px;height:58px;border-radius:18px;background:#f2f3f5;font-weight:900}.timer-action.primary{background:#111;color:#fff} 
.complete-modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,18,23,.20);backdrop-filter:blur(7px);z-index:80} 
.complete-box{width:min(420px,calc(100% - 30px));background:#fff;border:2px solid #171717;border-radius:28px;padding:25px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.28);animation:pop .55s cubic-bezier(.16,1.4,.4,1)} 
.complete-art{font-size:74px;animation:bounce .8s ease both}.complete-title{font-family:Nunito;font-size:27px;font-weight:900}.complete-time{display:inline-block;border:2px solid #bd75d1;border-radius:18px;padding:8px 18px;font-weight:900;color:#702083} 
.complete-actions{display:grid;gap:9px;margin-top:18px}.complete-actions button{height:48px;border-radius:14px;background:#e8c5ef;font-weight:900} 
.complete-actions button:last-child{background:#fff;border:1px solid #c98ad8} 
.confetti{position:fixed;width:10px;height:18px;top:-30px;z-index:90;border-radius:5px;animation:fall 2.7s linear forwards} 
 
/* ---------- bottom nav ---------- */ 
.mobile-nav{display:none!important} 
.desktop-add{display:block} 
@keyframes pop{from{transform:scale(.78);opacity:0}to{transform:scale(1);opacity:1}} 
@keyframes bounce{0%{transform:translateY(18px) scale(.7)}65%{transform:translateY(-8px) scale(1.08)}100%{transform:none}} 
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}} 
@media(max-width:1050px){ 
  .dashboard{grid-template-columns:190px minmax(0,1fr);max-width:1000px} 
  .right{display:none} 
} 
@media(max-width:700px){ 
  body{background:#f7fcff} 
  .dashboard{display:block;min-height:100vh;padding:0 14px 105px} 
  .rail{display:none} 
  .main{padding:14px 0 30px} 
  .topbar{margin:5px 2px 16px}.page-title{font-size:27px}.page-sub{font-size:11px} 
  .menu-btn{width:44px;height:44px;border-radius:15px} 
  .hero{border-radius:22px;padding:17px}.hero-time{font-size:44px} 
  .subject-head{margin-top:20px} 
  .subject-card{grid-template-columns:62px 1fr auto} 
  .subject-color{height:56px} 
  .chart-card{border-radius:22px}.chart-wrap{height:220px} 
  .mobile-nav{ 
    position:fixed;display:grid;grid-template-columns:repeat(4,1fr);align-items:center; 
    left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom)); 
    height:68px;padding:6px;border-radius:24px;background:rgba(255,255,255,.90); 
    border:1px solid rgba(30,35,45,.10);box-shadow:0 14px 38px rgba(39,51,68,.17); 
    backdrop-filter:blur(22px);z-index:30; 
  } 
  .bottom-item{height:56px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9ca1aa;font-size:10px;font-weight:800} 
  .bottom-item i{font-size:21px;font-style:normal;line-height:1} 
  .bottom-item.active{color:#111;background:rgba(80,196,235,.13)} 
  .bottom-item.add{color:#111;background:rgba(255,255,255,.42);box-shadow:none} 
  .bottom-item.add small{color:#111} 
  .right{display:none} 
  .timer-box{padding:18px;border-radius:28px}.clock{width:235px;height:235px}.clock strong{font-size:35px} 
  .profile-top{align-items:flex-start}.profile-avatar{width:78px;height:78px} 
  .profile-name{font-size:20px} 
  .complete-box{border-radius:26px} 
} 
@media(min-width:701px){ 
  .onboard-card,.form-screen{background:rgba(255,255,255,.55);border:1px solid rgba(40,50,60,.08);border-radius:34px;box-shadow:var(--shadow);backdrop-filter:blur(18px)} 
} 
@media(prefers-reduced-motion:reduce){ 
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important} 
} 
 
/* ===== PREMIUM V2 OVERRIDES ===== */ 
:root{ 
  --ink:#111218; 
  --muted:#707784; 
  --accent:#8f36c9; 
  --accent2:#42c8ef; 
  --danger:#ff4d68; 
  --danger-soft:rgba(255,77,104,.10); 
} 
.icon-svg{width:21px;height:21px;stroke-width:2.15;flex:0 0 auto} 
.subject-icon-svg{width:25px;height:25px;stroke-width:2.2} 
.icon-choice{ 
  display:flex;align-items:center;gap:9px;flex-wrap:wrap; 
  margin-top:8px; 
} 
.icon-choice button{ 
  width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line); 
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,50,70,.06); 
} 
.icon-choice button.active{border-color:#8f36c9;box-shadow:0 0 0 3px rgba(143,54,201,.12)} 
.subject-menu-wrap{position:relative} 
.subject-menu{ 
  position:absolute;right:0;top:44px;z-index:20;width:185px;padding:7px; 
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px; 
  box-shadow:0 18px 45px rgba(28,34,44,.18);backdrop-filter:blur(18px); 
} 
.subject-menu button{ 
  width:100%;text-align:left;background:transparent;border-radius:11px;padding:10px 11px; 
  font-weight:700;font-size:12px; 
} 
.subject-menu button:hover{background:#f5f6f8} 
.danger-modal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:rgba(18,20,25,.30);backdrop-filter:blur(13px);z-index:70} 
.danger-box{

.chat-bubble-wrap{position:relative}

  transform:translateY(5px) scale(.94);

  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);

} 
.chat-hover-actions button{ 
  width:30px;height:30px;border:0;border-radius:50%;

  font-size:14px;cursor:pointer;

}

.chat-reaction-picker{

  display:flex; 
  align-items:center; 
  gap:3px; 
  padding:6px 8px; 
  border-radius:25px;

  border:1px solid rgba(20,25,35,.08); 
  box-shadow:0 18px 50px rgba(20,28,38,.22); 
  backdrop-filter:blur(20px); 
  transform-origin:center bottom; 
  animation:igReactionPickerIn .20s cubic-bezier(.2,.9,.2,1) both; 
} 
.chat-reaction-picker button{ 
  width:38px;height:38px; 
  border:0;background:transparent;border-radius:50%; 
  font-size:23px;cursor:pointer; 
  transform:translateY(8px) scale(.55); 
  animation:igReactionItemIn .28s cubic-bezier(.2,1.45,.3,1) forwards; 
} 
.chat-reaction-picker button:nth-child(2){animation-delay:.018s} 
.chat-reaction-picker button:nth-child(3){animation-delay:.036s} 
.chat-reaction-picker button:nth-child(4){animation-delay:.054s} 
.chat-reaction-picker button:nth-child(5){animation-delay:.072s} 
.chat-reaction-picker button:nth-child(6){animation-delay:.09s} 
.chat-reaction-picker button:hover{transform:scale(1.22)!important} 
@keyframes igReactionPickerIn{ 
  from{opacity:0;transform:translateY(7px) scale(.72)} 
  to{opacity:1;transform:translateY(0) scale(1)} 
}

  to{transform:translateY(0) scale(1)} 
} 
.chat-reaction-pop{

/* From Uiverse.io by gagan-gv — global loading spinner */
.global-loader{
  position:fixed;inset:0;z-index:9999;
  display:grid;place-items:center;
  background:rgba(12,16,22,.32);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .45s cubic-bezier(.22,.61,.36,1), visibility .45s cubic-bezier(.22,.61,.36,1);
}
.global-loader.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.global-loader.hidden{display:none!important}
.spinner {
 border: 0 solid transparent;
 border-radius: 50%;
 width: 50px;
 height: 50px;
 position:relative;
}
.loader {
 width: inherit;
 height: inherit;
 position: absolute;
}
.loader::before,
.loader::after {
 content: '';
 border: 3px solid #505065;
 border-radius: 50%;
 width: inherit;
 height: inherit;
 position: absolute;
 opacity: 1;
}
.l1::before,
.l1::after {
 animation: clockwiseZ 2.5s infinite;
}
.l2::after,
.l2::before {
 animation: anticlockwiseZ 2.5s infinite;
}
@keyframes clockwiseZ {
 0%, 100% {
  transform: rotateY(0);
 }
 50% {
  transform: rotateY(180deg) skew(-10deg, -5deg);
 }
}
@keyframes anticlockwiseZ {
 0%, 100% {
  transform: rotateX(0);
 }
 50% {
  transform: rotateX(-180deg) skew(10deg, 5deg);
 }
}

let __loaderFadeTimer=null;
const LOADER_MIN_MS=900;
const LOADER_FADE_MS=450;
function showLoader(){
  const el=document.getElementById("globalLoader");
  if(!el)return;
  if(__loaderHideTimer){clearTimeout(__loaderHideTimer);__loaderHideTimer=null}
  if(__loaderFadeTimer){clearTimeout(__loaderFadeTimer);__loaderFadeTimer=null}
  el.classList.remove("hidden");
  // force reflow so opacity + scale transition plays every time
  void el.offsetWidth;
  el.classList.add("show");
  __loaderShownAt=Date.now();
}
function hideLoader(){
  const el=document.getElementById("globalLoader");
  if(!el)return;
  const elapsed=Date.now()-(__loaderShownAt||0);
  const wait=Math.max(0,LOADER_MIN_MS-elapsed);
  if(__loaderHideTimer)clearTimeout(__loaderHideTimer);
  if(__loaderFadeTimer)clearTimeout(__loaderFadeTimer);
  __loaderHideTimer=setTimeout(()=>{
    el.classList.remove("show");
    __loaderFadeTimer=setTimeout(()=>{
      if(!el.classList.contains("show"))el.classList.add("hidden");
      __loaderFadeTimer=null;
    },LOADER_FADE_MS);
    __loaderHideTimer=null;
  },wait);
}

function collection(parent,...path){
  if(!path.length)throw new Error("collection() requires a path");
  let ref=parent.collection(path[0]);
  for(let i=1;i<path.length;i+=2){
    ref=ref.doc(path[i]);
    if(i+1<path.length)ref=ref.collection(path[i+1]);
  }
  return ref;
}
function doc(parent,...path){
  if(path.length<2)throw new Error("doc() requires at least collection and id");
  let ref=parent.collection(path[0]).doc(path[1]);
  for(let i=2;i<path.length;i+=2){
    if(i+1>=path.length)throw new Error("doc() path must end on a document id");
    ref=ref.collection(path[i]).doc(path[i+1]);
  }
  return ref;
} 
function getDoc(ref){return ref.get()} 
function setDoc(ref,data,options){return ref.set(data,options)} 
function updateDoc(ref,data){return ref.update(data)}

function where(field,op,value){return {kind:"where",field,op,value}} 
function orderBy(field,direction){return {kind:"orderBy",field,direction}} 
function limit(n){return {kind:"limit",n}} 
function query(base,...constraints){let q=base;for(const c of constraints){if(c.kind==="where")q=q.where(c.field,c.op,c.value);else if(c.kind==="orderBy")q=q.orderBy(c.field,c.direction);else if(c.kind==="limit")q=q.limit(c.n)}return q}

function fmt(sec){ 
  sec=Math.max(0,Math.floor(sec)); 
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; 
  if(h)return `${h}h ${m}m`;

}

async function startGoogle(){
  if(firebaseReady&&auth){
    showLoader();
    try{
      const provider=new GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await signInWithPopup(auth,provider);
      const u=auth.currentUser;
      state.authUid=u?.uid||"";
      state.user=state.user||{};
      state.user.email=u?.email||state.user.email||"";
      state.user.dp=state.user.dp||u?.photoURL||"";
      let existingProfile=false;
      if(firestore&&u?.uid){
        try{
          const snap=await getDoc(doc(firestore,"users",u.uid));
          if(snap.exists){
            const cloud=snap.data()||{};
            state={...state,...cloud,authUid:u.uid};
            state.user=state.user||{};
            state.user.email=u?.email||state.user.email||"";
            state.user.dp=state.user.dp||u?.photoURL||"";
            existingProfile=!!(state.user.name&&state.user.username&&state.user.birthday);
          }
        }catch(e){console.warn("Google profile lookup failed",e)}
      }
      if(existingProfile){state.onboarding="done";}
      else{state.user.name=state.user.name||u?.displayName||"";state.user.username=state.user.username||"";state.onboarding="name";}
      save();render();
      return;
    }catch(err){
      console.error(err);
      warn("Google sign-in failed","Check your Firebase Google provider and authorized domain.",{danger:true,icon:"alert-triangle"});
      return;
    }finally{hideLoader()}
  }
  state.onboarding="name";save();render();
}

function toggleAuthPassword(id,btn){

async function submitEmailAuth(){
  emailAuthMode=(state.authView==="signup"||emailAuthMode==="signup")?"signup":"login";
  const email=(document.getElementById("emailAuthEmail")?.value||"").trim().toLowerCase();
  const password=document.getElementById("emailAuthPassword")?.value||"";
  const confirmPassword=document.getElementById("emailAuthConfirmPassword")?.value||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){showChatDialog({title:"Invalid email",message:"Please enter a valid email address.",icon:"✉️",confirmText:"OK"});return}
  if(password.length<6){showChatDialog({title:"Password too short",message:"Password must be at least 6 characters.",icon:"🔒",confirmText:"OK"});return}
  if(emailAuthMode==="signup"&&password!==confirmPassword){showChatDialog({title:"Passwords do not match",message:"Please enter the same password in both fields.",icon:"🔒",confirmText:"OK"});return}
  if(!firebaseReady||!auth){showChatDialog({title:"Email login unavailable",message:"Firebase Authentication is not connected. Enable Email/Password in Firebase Authentication first.",icon:"⚠️",danger:true,confirmText:"OK"});return}
  showLoader();
  try{
    const credential=emailAuthMode==="signup"?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);
    const u=credential.user;state.authUid=u?.uid||"";state.user=state.user||{};state.user.email=u?.email||email;state.user.dp=state.user.dp||u?.photoURL||"";
    let existingProfile=false;
    if(firestore&&u?.uid){
      try{
        const snap=await getDoc(doc(firestore,"users",u.uid));
        if(snap.exists){const cloud=snap.data()||{};state={...state,...cloud,authUid:u.uid};state.user=state.user||{};state.user.email=u?.email||state.user.email||email;state.user.dp=state.user.dp||u?.photoURL||"";existingProfile=!!(state.user.name&&state.user.username&&state.user.birthday)}
      }catch(e){console.warn("Email profile lookup failed",e)}
    }
    closeEmailAuth();state.onboarding=existingProfile?"done":"name";save();render();
  }catch(err){
    console.error("Email auth failed",err);const code=err?.code||"";
    const msg=code==="auth/email-already-in-use"?"This email is already used by another account. Please log in, or use a different email.":code==="auth/invalid-credential"||code==="auth/wrong-password"||code==="auth/user-not-found"?"Email or password is incorrect.":code==="auth/weak-password"?"Choose a stronger password.":err?.message||"Email authentication could not be completed.";
    showChatDialog({title:emailAuthMode==="signup"?"Sign up failed":"Login failed",message:msg,icon:"⚠️",danger:true,confirmText:"OK"});
  }finally{hideLoader()}
}

/* ---------- timer ---------- */ 
function timerHost(){return document.getElementById("persistentTimerHost")} 
function timerVisibleOnCurrentPage(){return activePage==="home"} 
function syncPersistentTimerVisibility(){ 
  const host=timerHost();if(!host)return; 
  if(!timerState.subject||!timerVisibleOnCurrentPage()){host.innerHTML="";return} 
  if(timerMinimized)renderTimerMini();else renderTimerModal(); 
} 
function openTimer(id){ 
  const s=state.subjects.find(x=>x.id===id);if(!s)return; 
  clearInterval(timer);timer=null; 
  timerState={subject:s,remaining:3600,total:3600,running:false,startedAt:0}; 
  timerMinimized=false; 
  syncPersistentTimerVisibility(); 
} 
function renderTimerModal(){ 
  const s=timerState.subject;if(!s)return; 
  const host=timerHost();if(!host)return; 
  host.innerHTML=` 
    <div class="persistent-timer-modal"> 
      <section class="persistent-timer-box"> 
        <div class="timer-top"> 
          <div class="timer-subject"><i data-lucide="${esc(s.icon||"book-open")}" class="icon-svg"></i> ${esc(s.name)}</div> 
          <div style="display:flex;gap:7px;align-items:center"> 
            <button class="timer-minimize-btn" title="Minimize timer" onclick="minimizeTimer()">−</button> 
            <button class="close-round" onclick="closeTimer()">×</button> 
          </div> 
        </div> 
        <div class="duration-row"> 
          ${[15,30,60,120].map(m=>`<button class="duration ${m===Math.round(timerState.total/60)?"active":""}" onclick="chooseDuration(${m},this)">${m<60?m+" min":m/60+" h"}</button>`).join("")} 
        </div> 
        <div class="clock"><div><strong id="timerDisplay">${fmtClock(timerState.remaining)}</strong><small>focus time</small></div></div> 
        <div class="timer-actions"> 
          <button class="timer-action" onclick="resetTimer()">Reset</button> 
          <button class="timer-action primary" id="timerPlay" onclick="toggleTimer()">${timerState.running?"Pause":(timerState.startedAt?"Resume":"Start")}</button> 
          <button class="timer-action" onclick="finishTimer()">Done</button> 
        </div> 
      </section> 
    </div>`; 
  if(window.lucide)lucide.createIcons(); 
} 
function renderTimerMini(){ 
  const host=timerHost();if(!host)return; 
  host.innerHTML=` 
    <div class="persistent-timer-mini" id="timerMinimized"> 
      <div><small>${esc(timerState.subject?.name||"Focus")}</small><strong id="timerMiniDisplay">${fmtClock(timerState.remaining)}</strong></div> 
      <button class="open" onclick="restoreTimer()">Open</button> 
      <button class="close" onclick="closeTimer()">×</button> 
    </div>`; 
} 
function minimizeTimer(){timerMinimized=true;syncPersistentTimerVisibility()} 
function restoreTimer(){timerMinimized=false;syncPersistentTimerVisibility()} 
function updateTimerMiniUI(){ 
  const el=document.getElementById("timerMiniDisplay");if(el)el.textContent=fmtClock(timerState.remaining); 
} 
function chooseDuration(min,btn){ 
  clearInterval(timer);timer=null; 
  document.querySelectorAll(".duration").forEach(x=>x.classList.remove("active"));btn.classList.add("active"); 
  timerState.total=timerState.remaining=min*60;timerState.running=false;timerState.startedAt=0; 
  document.getElementById("timerPlay").textContent="Start"; 
  updateTimerUI();updateTimerMiniUI(); 
} 
function toggleTimer(){ 
  if(timerState.running){pauseTimer();return} 
  timerState.running=true; 
  timerState.startedAt=timerState.startedAt||Date.now(); 
  const btn=document.getElementById("timerPlay");if(btn)btn.textContent="Pause"; 
  if(firebaseReady&&firebaseUser)syncPublicProfile(); 
  clearInterval(timer); 
  timer=setInterval(()=>{ 
    timerState.remaining=Math.max(0,timerState.remaining-1); 
    updateTimerUI();updateTimerMiniUI(); 
    if(timerState.remaining<=0){ 
      clearInterval(timer);timer=null;timerState.running=false;completeTimer(); 
    } 
  },1000); 
} 
function pauseTimer(){ 
  clearInterval(timer);timer=null;timerState.running=false; 
  const btn=document.getElementById("timerPlay");if(btn)btn.textContent="Resume"; 
  updateTimerMiniUI(); 
  if(firebaseReady&&firebaseUser)syncPublicProfile(); 
} 
function resetTimer(){ 
  clearInterval(timer);timer=null;timerState.remaining=timerState.total;timerState.running=false;timerState.startedAt=0; 
  const btn=document.getElementById("timerPlay");if(btn)btn.textContent="Start"; 
  updateTimerUI();updateTimerMiniUI(); 
  if(firebaseReady&&firebaseUser)syncPublicProfile(); 
} 
function updateTimerUI(){ 
  const el=document.getElementById("timerDisplay");if(el)el.textContent=fmtClock(timerState.remaining); 
  updateTimerMiniUI(); 
} 
function finishTimer(){ 
  const goal=Math.max(1, timerState.total||0);
  const elapsed=Math.max(0, (timerState.total||0)-(timerState.remaining||0));
  const subjectName=timerState.subject?.name||"Focus";
  if(elapsed<1){closeTimer();return}
  saveSession(elapsed);
  closeTimer();
  renderApp();
  // Always show motivational wish after Done
  const studied=Math.max(1,elapsed);
  let pct=Math.round((studied/Math.max(1,goal))*100);
  if(pct<1)pct=1; if(pct>100)pct=100;
  setTimeout(()=>{
    showTargetResultModal({completed:pct>=99, studied, goal:Math.max(1,goal), pct});
  }, 30);
} 
function saveSession(seconds){ 
  const s=state.subjects.find(x=>x.id===timerState.subject.id);if(!s)return; 
  s.seconds=(s.seconds||0)+seconds; 
  state.sessions.push({subject:s.name,seconds,at:new Date().toISOString()}); 
  state.target.done=(state.target.done||0)+Math.floor(seconds/60); 
  save(); 
} 
function completeTimer(){ 
  const elapsed=timerState.total||0;
  const goal=Math.max(1,elapsed);
  const subjectName=timerState.subject?.name||"Focus";
  saveSession(elapsed);
  closeTimer();
  renderApp();
  setTimeout(()=>{
    showTargetResultModal({completed:true, studied:Math.max(1,elapsed), goal, pct:100});
  }, 30);
} 
function closeTimer(){ 
  clearInterval(timer);timer=null; 
  timerState={subject:null,remaining:0,total:0,running:false,startedAt:0}; 
  timerMinimized=false; 
  const host=timerHost();if(host)host.innerHTML="";
  if(firebaseReady&&firebaseUser)syncPublicProfile();
} 
function showComplete(seconds,subject){ 
  const host=document.getElementById("modalHost"); 
  host.innerHTML=`<div class="complete-modal"><section class="complete-box"><div class="complete-art">🦔🎉</div><div class="complete-time">${fmt(seconds)} of focus</div><h2 class="complete-title">You did great!</h2><p class="hero-sub">${esc(subject)} session completed. Keep your little streak going.</p><div class="complete-actions"><button onclick="closeComplete()">Continue</button><button onclick="closeComplete();navigate('target')">View target</button></div></section></div>`; 
  for(let i=0;i<28;i++){ 
    const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"%";c.style.background=["#a52fc4","#72c9ef","#ffe638","#54b95b","#ef2670"][i%5];c.style.setProperty("--x",(Math.random()*260-130)+"px");c.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3300); 
  } 
} 
function closeComplete(){const m=document.getElementById("modalHost");if(m)m.innerHTML="";closeWishModal()}

  state.target.running=true; 
  state.target.startedAt=Date.now(); 
  save();renderApp(); 
  if(firebaseReady&&firebaseUser)syncPublicProfile(); 
}

/* Local midnight (browser timezone) — 1D resets here every night. */
function startOfLocalDay(date=new Date()){
  const d=new Date(date);
  d.setHours(0,0,0,0);
  return d.getTime();
}
function filteredSessions(){
  const sessions=state.sessions||[];
  const filter=state.filter||"1d";
  // All time = every session since the user started using the app
  if(filter==="all")return sessions;

  const dayStart=startOfLocalDay();
  let cutoff;
  if(filter==="1d"){
    // Today only — after 12:00 AM local, yesterday's sessions drop out
    cutoff=dayStart;
  }else if(filter==="7d"){
    // Today + previous 6 calendar days
    cutoff=dayStart-6*86400000;
  }else if(filter==="30d"){
    // Today + previous 29 calendar days
    cutoff=dayStart-29*86400000;
  }else{
    cutoff=dayStart;
  }
  return sessions.filter(s=>{
    const t=new Date(s.at).getTime();
    return Number.isFinite(t) && t>=cutoff;
  });
}
function filterPeriodLabel(filter){
  return ({
    "1d":"Today",
    "7d":"Last 7 days",
    "30d":"Last 30 days",
    "all":"All time"
  })[filter]||"Today";
}

/* Local username uniqueness + Firestore username reservation when configured. */ 
async function claimUsername(username){ 
  const clean=String(username||"").trim().replace(/^@/,"").toLowerCase(); 
  if(!clean)return false; 
  if(!/^[a-z0-9._-]{3,20}$/.test(clean))return false;
  const me=currentUid()||state.authUid||state.user.email||"local-user";
  const ownerKey="study_circle_username_registry_v1"; 
  let registry={};
  try{registry=JSON.parse(localStorage.getItem(ownerKey)||"{}")}catch(e){registry={}}
  if(registry[clean] && registry[clean]!==me)return false;

  // Cloud is source of truth: one username → one user
  if(firebaseReady&&firestore){ 
    try{ 
      const ref=doc(firestore,"usernames",clean); 
      await runTransaction(firestore,async tx=>{ 
        const snap=await tx.get(ref); 
        if(snap.exists){
          const owner=snap.data()?.uid||"";
          if(owner && owner!==me)throw new Error("USERNAME_TAKEN");
        }
        tx.set(ref,{
          uid:me,
          username:clean,
          email:(state.user?.email||firebaseUser?.email||"").toLowerCase()||null,
          updatedAt:serverTimestamp()
        },{merge:true}); 
      });
      // Extra check: publicProfiles should not already use this username for someone else
      try{
        const q=query(collection(firestore,"publicProfiles"),where("usernameLower","==",clean),limit(3));
        const snap=await getDocs(q);
        for(const d of snap.docs){
          if(d.id!==me)return false;
        }
      }catch(e){console.warn("username profile check",e)}
    }catch(e){
      if(String(e.message||e).includes("USERNAME_TAKEN"))return false;
      console.warn("claimUsername",e);
      // If online claim failed unexpectedly, still block to avoid duplicates
      if(firebaseReady)return false;
    } 
  } 
  // free previous local username for this user
  Object.keys(registry).forEach(k=>{if(registry[k]===me && k!==clean)delete registry[k]});
  registry[clean]=me;
  try{localStorage.setItem(ownerKey,JSON.stringify(registry))}catch(e){}
  return true; 
}

async function isUsernameAvailable(username){
  const clean=String(username||"").trim().replace(/^@/,"").toLowerCase();
  if(!clean || !/^[a-z0-9._-]{3,20}$/.test(clean))return false;
  const me=currentUid()||state.authUid||"";
  if(firebaseReady&&firestore){
    try{
      const snap=await getDoc(doc(firestore,"usernames",clean));
      if(snap.exists){
        const owner=snap.data()?.uid||"";
        return !owner || owner===me;
      }
      return true;
    }catch(e){console.warn(e);return false}
  }
  try{
    const registry=JSON.parse(localStorage.getItem("study_circle_username_registry_v1")||"{}");
    return !registry[clean] || registry[clean]===me;
  }catch(e){return true}
}

function startTargetTicker(){
  clearInterval(window.targetTicker);
  const goal=Math.max(1,state.target.minutes*60);
  window.targetTicker=setInterval(()=>{
    if(!state.target.running){clearInterval(window.targetTicker);return}
    const t=targetElapsedSeconds();
    const pct=Math.min(100,Math.round(t/goal*100));
    ["targetLiveClock","sideTargetClock"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=fmtClock(t)});
    const mainBar=document.getElementById("targetMainProgress");
    const sideBar=document.getElementById("sideTargetProgress");
    if(mainBar)mainBar.style.width=pct+"%";
    if(sideBar)sideBar.style.width=pct+"%";
    const mainStatus=document.getElementById("targetMainStatus");
    if(mainStatus)mainStatus.textContent=fmt(t)+" studied • "+pct+"% complete";
    const sideStatus=document.getElementById("sideTargetStatus");
    if(sideStatus)sideStatus.textContent=fmt(t)+" studied today";
    const sidePct=document.getElementById("sideTargetPct");
    if(sidePct)sidePct.textContent=pct+"%";
    if(t>=goal){
      recordTargetSegment();
      state.target.running=false;
      clearInterval(window.targetTicker);
      // Full complete → progress line resets to 0 for next run
      state.target.doneSeconds=0;
      state.target.done=0;
      save();
      renderApp();
      showTargetComplete();
    }
  },250);
}

function targetMotivationCopy(pct, completed){
  if(completed || pct>=99){
    return {icon:"check-circle-2", tone:"great", title:"Target complete", msg:"You finished today's target. Great focus — keep this consistency going."};
  }
  if(pct>=90){
    return {icon:"alert-circle", tone:"almost", title:"Almost finished", msg:"You were very close to the full target. A little more next time will complete it."};
  }
  if(pct>=80){
    return {icon:"alert-circle", tone:"close", title:"Nearly there", msg:"You completed most of the target. Try one more short session to finish strong."};
  }
  if(pct>=50){
    return {icon:"alert-triangle", tone:"solid", title:"Halfway done", msg:"You stopped at about half. Consistency matters — come back and finish the rest."};
  }
  if(pct>=25){
    return {icon:"alert-triangle", tone:"start", title:"Session too short", msg:"You only completed a small part of the target. Stay longer next time to build real progress."};
  }
  return {icon:"alert-triangle", tone:"keep", title:"Early stop", msg:"You stopped too early. Starting is good, but longer focus sessions will help you reach your goal."};
}

  const reader=new FileReader(); 
  reader.onload=()=>{

    img.onload=()=>{ 
      const max=512,scale=Math.min(1,max/Math.max(img.width,img.height)); 
      const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale)); 
      const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height); 
      const data=canvas.toDataURL("image/jpeg",0.82);

async function publishMyPublicProfile(){

function playMessageSound(){ 
  try{ 
    const ctx=new (window.AudioContext||window.webkitAudioContext)(); 
    const o=ctx.createOscillator(); 
    const g=ctx.createGain(); 
    o.connect(g);g.connect(ctx.destination); 
    o.type="sine"; 
    o.frequency.setValueAtTime(880,ctx.currentTime); 
    o.frequency.setValueAtTime(1175,ctx.currentTime+0.08); 
    g.gain.setValueAtTime(0.0001,ctx.currentTime); 
    g.gain.exponentialRampToValueAtTime(0.12,ctx.currentTime+0.02); 
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.28); 
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.3); 
  }catch(e){} 
}

function loadChatList(){ 
  if(chatListUnsub)try{chatListUnsub()}catch(e){} 
  const host=document.getElementById("chatList");if(!host||!firebaseReady||!firestore||!currentUid())return; 
  host.innerHTML=`<div class="chat-list-empty">Loading conversations…</div>`; 
  const me=currentUid(); 
  const chatsQ=query(collection(firestore,"chats"),where("participants","array-contains",me),limit(80)); 
  chatListUnsub=onSnapshot(chatsQ,async snap=>{ 
    try{ 
      const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>chatUpdatedMillis(b.updatedAt)-chatUpdatedMillis(a.updatedAt)); 
      chatListItems=rows; 
 
      // Fetch followed users and chat profiles in parallel so the inbox does 
      // not require Explore before showing people the user has already added. 
      const chatOtherIds=rows.map(r=>(r.participants||[]).find(x=>x!==me)).filter(Boolean); 
      const followingSnap=await getDocs(collection(firestore,"publicProfiles",me,"following")); 
      const followingIds=followingSnap.docs.map(d=>d.id).filter(uid=>uid!==me); 
      const allIds=[...new Set([...chatOtherIds,...followingIds])]; 
 
      const uncached=allIds.filter(uid=>!chatListProfilesCache[uid]); 
      if(uncached.length){ 
        const profiles=await Promise.all(uncached.map(async uid=>{ 
          try{ 
            const s=await getDoc(doc(firestore,"publicProfiles",uid)); 
            return s.exists?{uid:s.id,...s.data()}:null; 
          }catch(e){return null} 
        })); 
        profiles.filter(Boolean).forEach(u=>chatListProfilesCache[u.uid]=u); 
      } 
 
      const chatByUid=new Map(); 
      rows.forEach(row=>{ 
        const other=(row.participants||[]).find(x=>x!==me); 
        if(other)chatByUid.set(other,row); 
      }); 
 
      const chatUsers=chatOtherIds.map(uid=>({uid,row:chatByUid.get(uid),user:chatListProfilesCache[uid]||{uid,name:"Study User",username:"unknown",dp:""}})); 
      const chatUidSet=new Set(chatUsers.map(x=>x.uid)); 
      const followedOnly=followingIds.filter(uid=>!chatUidSet.has(uid)).map(uid=>({uid,row:null,user:chatListProfilesCache[uid]||{uid,name:"Study User",username:"unknown",dp:""}})); 
 
      // Recent conversations first; followed users without a conversation are 
      // shown after them, so the inbox feels like Messenger. 
      const merged=[...chatUsers,...followedOnly]; 
      if(!merged.length){ 
        host.innerHTML=`<div class="chat-list-empty">No chats yet.<br>Follow someone or search a username to start a conversation.</div>`; 
        updateChatUnreadBadges(); 
        return; 
      } 
      host.innerHTML=merged.map(({row,user})=>{ 
        const unread=isChatUnread(row); 
        return `<div class="chat-list-item ${selectedChatId===row?.id?"active":""} ${unread?"unread":""}" onclick="openChat('${esc(user.uid)}')"> 
          ${chatAvatarHTML(user)} 
          <div class="chat-list-copy"><b>${esc(user.name||"Study User")}</b><small>${esc(row?.lastMessage||"Start a conversation")}</small></div> 
          ${row?.updatedAt?`<small style="font-size:9px;color:#9aa1aa;align-self:flex-start">${formatChatTime(row.updatedAt)}</small>`:""} 
          <span class="chat-list-unread-dot" aria-label="Unread message"></span> 
        </div>`; 
      }).join(""); 
      updateChatUnreadBadges(); 
    }catch(err){ 
      console.warn("Chat list listener failed",err); 
      host.innerHTML=`<div class="chat-list-empty">Chats could not load. Check your Firestore rules.</div>`; 
    } 
  },err=>{ 
    console.warn("Chat list listener failed",err); 
    host.innerHTML=`<div class="chat-list-empty">Chats could not load. Check your Firestore rules.</div>`; 
  }); 
}

/* Apply a reaction in the local cache + DOM immediately (optimistic). */
function applyLocalReaction(messageId,emoji,uid){
  const mid=String(messageId);
  const cached=chatMessageCache.get(mid)||{id:mid,reactions:{}};
  const base=chatReactionStore.get(mid)||cached.reactions||{};
  const reactions={...base};
  const list=Array.isArray(reactions[emoji])?[...reactions[emoji]]:[];
  const idx=list.indexOf(uid);
  if(idx>=0)list.splice(idx,1);else list.push(uid);
  if(list.length)reactions[emoji]=list;else delete reactions[emoji];
  cached.reactions=reactions;
  chatMessageCache.set(mid,cached);
  chatReactionStore.set(mid,reactions);
  // Refresh chips under the bubble without reloading the whole thread
  const row=document.querySelector(`[data-message-row="${CSS.escape(mid)}"]`);
  if(row){
    let line=row.querySelector(".chat-reaction-line");
    const reactionHTML=Object.entries(reactions).filter(([_,ids])=>Array.isArray(ids)&&ids.length).map(([em,ids])=>{
      const reacted=ids.includes(uid);
      return `<button class="chat-reaction-chip ${reacted?"mine-reaction":""}" title="${reacted?"You reacted":"Reaction"}" onclick="reactToChatMessage('${esc(mid)}','${esc(em)}');event.stopPropagation()">${em} ${ids.length}</button>`;
    }).join("");
    if(reactionHTML){
      if(!line){line=document.createElement("div");line.className="chat-reaction-line";row.querySelector(".chat-bubble-wrap")?.appendChild(line)}
      line.innerHTML=reactionHTML;
    }else if(line){line.remove()}
  }
  return reactions;
}

async function reactToChatMessage(id,emoji){
  closeChatActionMenu();
  closeReactionPicker();
  closeChatActionSheet();
  if(!firestore||!selectedChatId||!currentUid()||!id)return;
  const uid=currentUid();
  const mid=String(id);
  const cid=selectedChatId;

  // Optimistic UI first
  const reactions=applyLocalReaction(mid,emoji,uid);
  const bubble=document.querySelector(`[data-message-id="${CSS.escape(mid)}"]`);
  if(bubble)showReactionPop(bubble,emoji);

  try{
    // Write onto the PARENT chat document using dotted field paths.
    // Participants can already update chats/{chatId} (lastMessage, typing…),
    // so this path works without new Firestore rules.
    // Shape: chats/{chatId}.rx.{messageId} = { "❤️": ["uid1"], ... }
    const chatRef=doc(firestore,"chats",cid);
    const payload={};
    payload["rx."+mid]=reactions;
    payload["rxUpdatedAt"]=serverTimestamp();
    await updateDoc(chatRef,payload);
  }catch(err1){
    // Fallback: full merge on chat doc (still the parent chat)
    try{
      const chatRef=doc(firestore,"chats",cid);
      const snap=await getDoc(chatRef);
      const prev=(snap.exists && snap.data() && snap.data().rx)||{};
      await setDoc(chatRef,{
        rx:{...prev,[mid]:reactions},
        rxUpdatedAt:serverTimestamp()
      },{merge:true});
    }catch(err2){
      console.warn("Reaction update failed",err1,err2);
      applyLocalReaction(mid,emoji,uid); // revert toggle
      chatWarning("Reaction failed","Could not save your reaction. Please try again.","😕");
    }
  }
}

function bindChatMessagePress(el,message){
  el.__message=message;
  let timer=null;
  let moved=false;
  // Mobile long-press → one combined sheet (reactions + reply)
  el.addEventListener("touchstart",e=>{
    moved=false;
    const t=e.touches?.[0];if(!t)return;
    el.__pressStart={x:t.clientX,y:t.clientY};
    timer=setTimeout(()=>{if(!moved)showChatActionMenu(message,el)},480);
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    const t=e.touches?.[0];if(!t||!el.__pressStart)return;
    if(Math.abs(t.clientX-el.__pressStart.x)>10||Math.abs(t.clientY-el.__pressStart.y)>10){
      moved=true;clearTimeout(timer);
    }
  },{passive:true});
  ["touchend","touchcancel"].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
  // Desktop right-click only (skip on touch to avoid double menus)
  el.addEventListener("contextmenu",e=>{
    e.preventDefault();
    if(window.matchMedia("(pointer: coarse)").matches)return;
    showChatActionMenu(message,el);
  });
} 
function subscribeToMessages(forChatId){ 
  if(chatMessagesUnsub){try{chatMessagesUnsub()}catch(e){} chatMessagesUnsub=null} 
  if(chatReactionsUnsub){try{chatReactionsUnsub()}catch(e){} chatReactionsUnsub=null} 
  const expectedId=forChatId||selectedChatId; 
  const me=currentUid(); 
  const other=selectedChatUser?.uid||""; 
  if(!expectedId||!me||!other)return; 
 
  const gen=++chatSubGen; 
  knownMsgIds=new Set(); 
  lastMsgCount=0; 
  chatReactionStore=new Map(); 
 
  const getHost=()=>document.getElementById("chatMessages"); 
  const host=getHost(); 
  if(!host)return; 

  // Live reactions live on the parent chat doc: chats/{id}.rx.{messageId}
  // (same document participants already update for lastMessage / typing)
  try{
    chatReactionsUnsub=onSnapshot(doc(firestore,"chats",expectedId),csnap=>{
      if(gen!==chatSubGen||selectedChatId!==expectedId)return;
      const rx=(csnap.exists && csnap.data() && csnap.data().rx)||{};
      chatReactionStore=new Map();
      Object.keys(rx).forEach(mid=>{
        const reactions=rx[mid]||{};
        chatReactionStore.set(String(mid),reactions);
        const cached=chatMessageCache.get(String(mid));
        if(cached){cached.reactions=reactions;chatMessageCache.set(String(mid),cached)}
      });
      const h=getHost();
      if(!h)return;
      chatReactionStore.forEach((reactions,mid)=>{
        const row=h.querySelector(`[data-message-row="${CSS.escape(mid)}"]`);
        if(!row)return;
        let line=row.querySelector(".chat-reaction-line");
        const reactionHTML=Object.entries(reactions||{}).filter(([_,ids])=>Array.isArray(ids)&&ids.length).map(([emoji,ids])=>{
          const reacted=ids.includes(currentUid());
          return `<button class="chat-reaction-chip ${reacted?"mine-reaction":""}" title="${reacted?"You reacted":"Reaction"}" onclick="reactToChatMessage('${esc(mid)}','${esc(emoji)}');event.stopPropagation()">${emoji} ${ids.length}</button>`;
        }).join("");
        if(reactionHTML){
          if(!line){line=document.createElement("div");line.className="chat-reaction-line";row.querySelector(".chat-bubble-wrap")?.appendChild(line)}
          line.innerHTML=reactionHTML;
        }else if(line){line.remove()}
      });
    },err=>console.warn("Reaction listener",err));
  }catch(e){console.warn("Reaction subscribe failed",e)}
 
  const q=query(collection(firestore,"chats",expectedId,"messages"),orderBy("createdAt","asc"),limit(200)); 
  chatMessagesUnsub=onSnapshot(q,snap=>{ 
    if(gen!==chatSubGen)return; // stale subscription 
    if(selectedChatId!==expectedId)return; 
    const h=getHost(); 
    if(!h)return; 
 
    // Only real messages are rendered. Legacy/accidental documents with 
    // missing or blank text must never appear as a timestamp-only bubble. 
    const docs=snap.docs 
      .filter(d=>messageBelongsToChat(d.data(), expectedId, me, other)) 
      .filter(d=>String(d.data()?.text??"").trim().length>0); 
 
    if(!docs.length){ 
      h.innerHTML=`<div class="chat-empty"><strong>Messages exchanged with your friends will be displayed here.</strong></div>`; 
      chatMessageCache=new Map(); 
      knownMsgIds=new Set(); 
      lastMsgCount=0; 
      return; 
    } 
 
    let shouldSound=false; 
    const initialMessageSnapshot = (lastMsgCount===0 && knownMsgIds.size===0); 
    docs.forEach(d=>{ 
      const m=d.data(); 
      if(!initialMessageSnapshot && !knownMsgIds.has(d.id) && m.senderId!==me && lastMsgCount>0){ 
        shouldSound=true; 
      } 
      knownMsgIds.add(d.id); 
    }); 
    if(shouldSound)playMessageSound(); 
    lastMsgCount=docs.length; 
    // The currently open conversation is considered read immediately. 
    const hasIncoming=docs.some(d=>d.data()?.senderId===other); 
    if(hasIncoming)markChatRead(expectedId); 
 
    chatMessageCache=new Map(docs.map(d=>{
      const base={id:d.id,...d.data()};
      // Prefer live reaction store; fall back to reactions embedded on the message
      if(chatReactionStore.has(String(d.id))) base.reactions=chatReactionStore.get(String(d.id));
      return [String(d.id),base];
    })); 
    h.innerHTML=docs.map(d=>{ 
      const m=d.data(); 
      const mine=m.senderId===me; 
      const reply=m.replyTo; 
      const reactions=(chatReactionStore.get(String(d.id))||m.reactions||{}); 
      const reactionHTML=Object.entries(reactions).filter(([_,ids])=>Array.isArray(ids)&&ids.length).map(([emoji,ids])=>{ 
        const reacted=ids.includes(currentUid()); 
        return `<button class="chat-reaction-chip ${reacted?"mine-reaction":""}" title="${reacted?"You reacted":"Reaction"}" onclick="reactToChatMessage('${esc(d.id)}','${esc(emoji)}');event.stopPropagation()">${emoji} ${ids.length}</button>`; 
      }).join(""); 
      const replyHTML=reply?`<div class="chat-bubble-reply"><b>${esc(reply.senderName||"User")}</b><br>${escapeChatText(reply.text||"")}</div>`:""; 
      const hoverActions=`<div class="chat-hover-actions" onmouseenter="event.stopPropagation()"> 
        <button title="React" onclick="openReactionPickerById('${esc(d.id)}',this);event.stopPropagation()">😊</button> 
        <button class="hover-reply" title="Reply" onclick="setChatReplyById('${esc(d.id)}');event.stopPropagation()">↩</button> 
        ${mine?`<button class="hover-delete" title="Delete" onclick="deleteChatMessage('${esc(d.id)}');event.stopPropagation()">🗑</button>`:""} 
      </div>`; 
      return `<div class="chat-bubble-row ${mine?"mine":""}" data-message-row="${esc(d.id)}"><div class="chat-bubble-wrap"><div class="chat-bubble" data-message-id="${esc(d.id)}">${replyHTML}${escapeChatText(m.text)}<div class="chat-bubble-time">${formatChatTime(m.createdAt)}</div></div>${hoverActions}${reactionHTML?`<div class="chat-reaction-line">${reactionHTML}</div>`:""}</div></div>`; 
    }).join(""); 
    docs.forEach(d=>{ 
      const el=h.querySelector(`[data-message-id="${CSS.escape(d.id)}"]`); 
      if(el){const m={id:d.id,...d.data()};bindChatMessagePress(el,m);} 
    }); 
    h.scrollTop=h.scrollHeight; 
  },err=>{ 
    if(gen!==chatSubGen)return; 
    console.warn("Message listener failed",err); 
    const h=getHost(); 
    if(h)h.innerHTML=`<div class="chat-empty">Messages could not load. Check your Firestore rules.</div>`; 
  }); 
}

async function sendChatMessage(){ 
  const input=document.getElementById("chatMessageInput");if(!input||!selectedChatUser||!currentUid()||!firestore)return; 
  const text=input.value.trim();if(!text)return; 
  if(chatBlockedByMe||chatBlockedMe){chatWarning("Messaging unavailable","You cannot send messages to this user right now.","🚫");return;} 
  const otherUid=selectedChatUser.uid; 
  const cid=chatIdFor(currentUid(),otherUid); 
  selectedChatId=cid; 
  if(!cid||!otherUid)return; 
  const btn=document.getElementById("chatSendBtn"); 
  if(btn)btn.disabled=true; 
  input.value=""; 
  try{ 
    const [mine,theirs]=await Promise.all([ 
      getDoc(doc(firestore,"blocks",`${currentUid()}_${otherUid}`)), 
      getDoc(doc(firestore,"blocks",`${otherUid}_${currentUid()}`)) 
    ]); 
    if(mine.exists||theirs.exists){await refreshBlockState(otherUid);renderChatWindow();subscribeToMessages(selectedChatId);if(btn)btn.disabled=false;chatWarning("Messaging unavailable","Messaging is unavailable because one of you has blocked the other.","🚫");return;} 
    const chatRef=doc(firestore,"chats",cid); 
    // Create/update chat first 
    await setDoc(chatRef,{ 
      participants:[currentUid(),otherUid].sort(), 
      lastMessage:text.slice(0,200), 
      lastMessageSenderId:currentUid(), 
      updatedAt:serverTimestamp(), 
      createdAt:serverTimestamp() 
    },{merge:true}); 
    // Then add message 
    const replyTo=pendingChatReply?{ 
      id:pendingChatReply.id, 
      text:pendingChatReply.text, 
      senderId:pendingChatReply.senderId, 
      senderName:pendingChatReply.senderName 
    }:null; 
    await addDoc(collection(firestore,"chats",cid,"messages"),{ 
      senderId:currentUid(), 
      receiverId:otherUid, 
      text, 
      ...(replyTo?{replyTo}:{}), 
      createdAt:serverTimestamp() 
    }); 
    clearChatReply(); 
    setTypingStatus(false); 
  }catch(err){ 
    console.error("Send message failed",err); 
    alert("Message could not be sent. Please update Firestore rules (see latest rules).\n\nError: "+(err.message||err)); 
    input.value=text; 
  }finally{
    if(btn)btn.disabled=false;
  } 
} 
 
/* Follow system: store each follower under the target public profile. 
   This avoids the old top-level `follows` permission problem and lets the 
   target profile expose follower/following data with simple rules. */ 
function followerRef(targetUid,followerUid=currentUid()){ 
  return doc(firestore,"publicProfiles",targetUid,"followers",followerUid); 
} 
async function toggleFollow(targetUid,btn){ 
  if(!firebaseReady||!currentUid()||targetUid===currentUid())return false; 
  const me=currentUid(); 
  const followingRef=doc(firestore,"publicProfiles",me,"following",targetUid); 
  const followerRefForTarget=followerRef(targetUid,me); 
  showLoader();
  try{ 
    // The current user's following collection is the single source of truth. 
    // Do not infer Following from an old/stale follower document. 
    const existing=await getDoc(followingRef); 
    if(existing.exists){ 
      await deleteDoc(followingRef); 
      try{await deleteDoc(followerRefForTarget)}catch(e){} 
      await publishMyPublicProfile(); 
      if(btn){btn.textContent="Follow";btn.classList.remove("following")} 
      if(activePage==="chats")loadChatList(); 
      return false; 
    }else{ 
      await setDoc(followingRef,{followingId:targetUid,ownerId:me,createdAt:serverTimestamp()},{merge:true}); 
      try{await setDoc(followerRefForTarget,{followerId:me,followingId:targetUid,createdAt:serverTimestamp()},{merge:true})}catch(e){} 
      await publishMyPublicProfile(); 
      if(btn){btn.textContent="Following";btn.classList.add("following")} 
      if(activePage==="chats")loadChatList(); 
      return true; 
    } 
  }catch(err){ 
    console.error("Follow update failed",err); 
    if(btn){btn.textContent="Follow";btn.classList.remove("following")} 
    alert("Could not update follow status. Please make sure the Firestore rules below are applied."); 
    return false; 
  }finally{hideLoader()} 
}

/* MOBILE PULL-TO-REFRESH — reload only when the page is at the top */ 
let pullStartY=null; 
let pullTracking=false; 
document.addEventListener("touchstart",e=>{ 
  if(window.innerWidth>700)return; 
  if(window.scrollY>0)return; 
  const touch=e.touches?.[0]; 
  if(!touch)return; 
  pullStartY=touch.clientY; 
  pullTracking=true; 
},{passive:true}); 
 
document.addEventListener("touchend",e=>{ 
  if(!pullTracking || window.innerWidth>700)return; 
  const touch=e.changedTouches?.[0]; 
  const endY=touch?.clientY; 
  const distance=(endY??pullStartY)-pullStartY; 
  pullTracking=false; 
  if(window.scrollY<=0 && distance>85){ 
    window.location.reload(); 
  } 
},{passive:true});

          <small>@${esc(u.username||"username")}</small>
        </div>
        ${isMe?"":`<button class="chat-follow-btn" data-follow-uid="${esc(u.uid)}" onclick="event.stopPropagation();toggleFollowFromList('${esc(u.uid)}',this)">Follow</button>`}
      </div>`;
    }).join("");
    for(const u of profiles){
      if(u.uid===currentUid())continue;
      const btn=body.querySelector(`[data-follow-uid="${CSS.escape(u.uid)}"]`);
      if(!btn)continue;
      const following=await isFollowing(u.uid);
      btn.textContent=following?"Following":"Follow";
      btn.classList.toggle("following",following);
    }
  }catch(err){
    console.warn("Follow list failed",err);
    const body=document.getElementById("followListBody");
    if(body)body.innerHTML=`<div class="follow-list-empty">Could not load this list. Check Firestore rules.</div>`;
  }finally{hideLoader()}
}

function closeFollowList(){
  // Only close the list overlay — keep profile / current page intact
  const h=document.getElementById("followListHost");
  if(h)h.innerHTML="";
}

async function toggleFollowFromList(uid,btn){
  await toggleFollow(uid,btn);
  // refresh counts on own profile if visible
  refreshMyFollowCounts();
}


/* ===== STUDYING NOW live strip ===== */
let studyingNowUnsub=null;
let studyingNowCache=[];

function stopStudyingNowListener(){
  if(studyingNowUnsub){try{studyingNowUnsub()}catch(e){}studyingNowUnsub=null}
}

function initStudyingNow(){
  const row=document.getElementById("studyingNowRow");
  if(!row)return;
  if(!firebaseReady||!firestore){
    row.innerHTML=`<div class="studying-now-empty">Sign in to see who is studying.</div>`;
    return;
  }
  stopStudyingNowListener();
  // Prefer query; fallback to client filter if rules/index block it
  try{
    const q=query(collection(firestore,"publicProfiles"),where("studyStatus","==","Studying"),limit(24));
    studyingNowUnsub=onSnapshot(q,snap=>{
      const users=snap.docs.map(d=>({uid:d.id,...d.data()}))
        .filter(u=>u.studyStatus==="Studying" && u.uid!==currentUid());
      studyingNowCache=users;
      renderStudyingNow(users);
    },async err=>{
      console.warn("Studying now query failed, fallback",err);
      try{
        const snap=await getDocs(query(collection(firestore,"publicProfiles"),orderBy("usernameLower"),limit(80)));
        const users=snap.docs.map(d=>({uid:d.id,...d.data()}))
          .filter(u=>u.studyStatus==="Studying" && u.uid!==currentUid());
        studyingNowCache=users;
        renderStudyingNow(users);
      }catch(e){
        row.innerHTML=`<div class="studying-now-empty">Could not load studying students.</div>`;
      }
    });
  }catch(e){
    row.innerHTML=`<div class="studying-now-empty">Could not load studying students.</div>`;
  }
}

function renderStudyingNow(users){
  const row=document.getElementById("studyingNowRow");
  if(!row)return;
  if(!users.length){
    row.innerHTML=`<div class="studying-now-empty">No one is studying right now. Be the first.</div>`;
    return;
  }
  row.innerHTML=users.slice(0,12).map(u=>{
    const subject=u.activeSubject||u.topSubject||"Focus";
    const avatar=u.dp?`<img src="${esc(u.dp)}" alt="">`:`🙂`;
    return `<button type="button" class="studying-now-item" onclick="openStudyingLiveCard('${esc(u.uid)}')">
      <div class="studying-now-avatar-wrap">
        <div class="studying-now-avatar">${avatar}</div>
        <span class="studying-now-live"></span>
      </div>
      <div class="studying-now-name">${esc(u.name||"Student")}</div>
      <div class="studying-now-subject"><i data-lucide="${esc(u.activeSubjectIcon||"book-open")}"></i>${esc(subject)}</div>
    </button>`;
  }).join("");
  if(window.lucide)lucide.createIcons();
}

function studyingElapsedSeconds(u){
  const started=Number(u.studyStartedAt||0);
  if(!started)return 0;
  return Math.max(0,Math.floor((Date.now()-started)/1000));
}

function openStudyingLiveCard(uid){
  const u=studyingNowCache.find(x=>x.uid===uid);
  if(!u){openUserProfile(uid);return}
  const subject=u.activeSubject||u.topSubject||"Focus";
  const elapsed=studyingElapsedSeconds(u);
  let host=document.getElementById("modalHost");
  if(!host){host=document.createElement("div");host.id="modalHost";document.body.appendChild(host)}
  host.innerHTML=`<div class="studying-live-modal" onclick="if(event.target===this)closeStudyingLiveCard()">
    <section class="studying-live-box">
      <div class="studying-now-avatar">${u.dp?`<img src="${esc(u.dp)}" alt="">`:`🙂`}</div>
      <h3>${esc(u.name||"Student")}</h3>
      <div class="handle">@${esc(u.username||"username")}</div>
      <div class="studying-live-meta">
        <div><span>Subject</span><b>${esc(subject)}</b></div>
        <div><span>Studying for</span><b id="studyingLiveElapsed">${fmt(elapsed)}</b></div>
        <div><span>Status</span><b style="color:#16a34a">● Live now</b></div>
      </div>
      <div class="studying-live-actions">
        <button class="ghost" onclick="closeStudyingLiveCard()">Close</button>
        <button class="primary" onclick="closeStudyingLiveCard();openUserProfile('${esc(uid)}')">View profile</button>
      </div>
    </section>
  </div>`;
  // live tick while open
  clearInterval(window.__studyingLiveTick);
  window.__studyingLiveTick=setInterval(()=>{
    const el=document.getElementById("studyingLiveElapsed");
    if(!el){clearInterval(window.__studyingLiveTick);return}
    el.textContent=fmt(studyingElapsedSeconds(u));
  },1000);
}

function closeStudyingLiveCard(){
  clearInterval(window.__studyingLiveTick);
  const h=document.getElementById("modalHost");
  if(h)h.innerHTML="";
}

function openStudyingNowAll(){
  if(!studyingNowCache.length){
    warn("Studying now","No one is studying right now.",{icon:"users",danger:false});
    return;
  }
  // reopen strip content as a simple list modal
  let host=document.getElementById("modalHost");
  if(!host){host=document.createElement("div");host.id="modalHost";document.body.appendChild(host)}
  host.innerHTML=`<div class="studying-live-modal" onclick="if(event.target===this)closeStudyingLiveCard()">
    <section class="studying-live-box" style="text-align:left;max-height:80vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font:900 18px Nunito">Studying now</h3>
        <button class="close-round" onclick="closeStudyingLiveCard()">×</button>
      </div>
      ${studyingNowCache.map(u=>`
        <button type="button" onclick="closeStudyingLiveCard();openStudyingLiveCard('${esc(u.uid)}')"
          style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 6px;border:0;background:transparent;border-bottom:1px solid rgba(0,0,0,.05);text-align:left;cursor:pointer">
          <div class="studying-now-avatar" style="width:44px;height:44px;margin:0;font-size:20px">${u.dp?`<img src="${esc(u.dp)}" alt="">`:`🙂`}</div>
          <div style="min-width:0;flex:1">
            <div style="font-weight:900;font-size:13px">${esc(u.name||"Student")}</div>
            <div style="font-size:11px;color:#8a919b;font-weight:700">${esc(u.activeSubject||"Focus")} • ${fmt(studyingElapsedSeconds(u))}</div>
          </div>
          <span class="studying-now-live" style="position:static;width:10px;height:10px"></span>
        </button>
      `).join("")}
    </section>
  </div>`;
}


/* ===== FORCE reliable target stop / wish (overrides any earlier defs) ===== */
function stopTarget(){
  try{
    const goal=Math.max(1, Number(state.target.minutes||1)*60);
    const before=typeof targetElapsedSeconds==="function" ? targetElapsedSeconds() : 0;
    if(state.target.running && typeof recordTargetSegment==="function"){
      try{recordTargetSegment()}catch(e){console.warn(e)}
    }
    state.target.running=false;
    state.target.startedAt=0;
    state.target.subjectStartedAt=0;
    try{clearInterval(window.targetTicker)}catch(e){}
    if(typeof save==="function")save();
    const studied=Math.max(1, Math.min(goal, Math.max(before, state.target.doneSeconds||0)));
    let pct=Math.round((studied/goal)*100);
    if(pct<1)pct=1;
    if(pct>100)pct=100;
    if(typeof renderApp==="function")renderApp();
    if(firebaseReady&&firebaseUser&&typeof syncPublicProfile==="function"){
      try{syncPublicProfile()}catch(e){}
    }
    setTimeout(()=>{
      try{
        showTargetResultModal({completed:pct>=99, studied, goal, pct});
      }catch(e){
        console.error(e);
        alert((pct>=99?"Target complete! ":"Session saved. ")+fmt(studied)+" of "+fmt(goal));
      }
    }, 40);
  }catch(err){
    console.error("stopTarget failed",err);
    alert("Stopped. (Wish UI error: "+(err.message||err)+")");
  }
}
window.stopTarget=stopTarget;

function showTargetComplete(){
  const goal=Math.max(1, Number(state.target.minutes||1)*60);
  state.target.doneSeconds=0;
  state.target.done=0;
  state.target.running=false;
  try{if(typeof save==="function")save()}catch(e){}
  try{if(typeof renderApp==="function")renderApp()}catch(e){}
  setTimeout(()=>showTargetResultModal({completed:true, studied:goal, goal, pct:100}), 40);
}
window.showTargetComplete=showTargetComplete;


render(); 
</script>
