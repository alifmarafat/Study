<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<!-- Firebase compat SDKs: required by the existing single-file auth/Firestore bridge below. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f6fbff;
  --surface:rgba(255,255,255,.88);
  --surface-solid:#fff;
  --ink:#111318;
  --muted:#6f7580;
  --line:rgba(24,28,35,.10);
  --shadow:0 12px 34px rgba(46,61,79,.10);
  --yellow:#ffe638;
  --blue:#72c9ef;
  --cyan:#3cc6ee;
  --purple:#a52fc4;
  --green:#54b95b;
  --pink:#ef2670;
  --lime:#e9ff24;
  --accent:#9f2abf;
  --nav:#ffffffd9;
  --danger:#ef476f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.96),transparent 34%),
    radial-gradient(circle at 100% 30%,rgba(184,238,255,.34),transparent 35%),
    #f5fbff;
}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}
.app-shell{min-height:100vh;position:relative}
.honeycomb{
  position:fixed;inset:0;pointer-events:none;opacity:.28;z-index:0;
  background-image:
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(30deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(150deg,rgba(150,180,205,.12) 12%,transparent 12.5%,transparent 87%,rgba(150,180,205,.12) 87.5%,rgba(150,180,205,.12)),
    linear-gradient(60deg,rgba(150,180,205,.08) 25%,transparent 25.5%,transparent 75%,rgba(150,180,205,.08) 75%);
  background-size:80px 140px;
  background-position:0 0,0 0,40px 70px,40px 70px,0 0;
}
.page{position:relative;z-index:1}
button,.card,.subject-card,.nav-item,.bottom-item,.task,.profile-card{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease,border-color .22s ease,opacity .22s ease}
button:active{transform:scale(.965)!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(70,190,240,.30);outline-offset:2px}

/* ---------- onboarding ---------- */
.onboarding{min-height:100vh;display:grid;place-items:center;padding:24px}
.onboard-card{width:min(520px,100%);text-align:center;min-height:700px;display:flex;flex-direction:column;justify-content:center;padding:34px 28px}
.brand-art{width:210px;height:160px;margin:0 auto 28px;display:grid;place-items:center;position:relative}
.brand-note{width:150px;height:110px;background:#ffe38a;display:grid;place-items:center;font-family:Nunito;font-size:27px;line-height:1.05;transform:rotate(-1.5deg);box-shadow:0 12px 20px rgba(60,60,30,.08);border:2px solid #303030;border-radius:3px;position:relative;z-index:2}
.brand-note:after{content:"";position:absolute;right:-18px;bottom:-4px;width:35px;height:45px;background:#fff;border-left:2px solid #303030;transform:skew(-18deg);z-index:-1}
.hedgehog{position:absolute;right:35px;bottom:15px;font-size:64px;z-index:3;filter:drop-shadow(0 4px 2px rgba(0,0,0,.08))}
.onboard-title{font-family:Nunito;font-size:24px;font-weight:900;margin:0 0 26px}
.onboard-copy{font-size:18px;line-height:1.55;color:#343840;margin:0 auto 38px;max-width:430px}
.primary-btn,.secondary-btn{
  width:100%;height:58px;border-radius:31px;font-size:17px;font-weight:800;
  box-shadow:0 7px 15px rgba(35,42,50,.12);
}
.primary-btn{background:var(--yellow)}
.secondary-btn{background:#73ccef}
.google-btn{background:#fff;border:1px solid rgba(0,0,0,.11);display:flex;align-items:center;justify-content:center;gap:12px}
.google-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#4285f4}
.onboard-actions{display:grid;gap:16px}
.form-screen{width:min(520px,100%);padding:40px 30px;min-height:620px;display:flex;flex-direction:column}
.back-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);margin-bottom:34px}
.form-title{text-align:center;font-family:Nunito;font-size:27px;margin:0 0 30px}
.form-help{font-size:16px;line-height:1.5;color:#555c67;margin:0 0 20px}
.big-input{height:78px;width:100%;border:2px solid #15171b;border-radius:24px;background:#fff;padding:0 20px;font-size:21px;color:#17181c}
.form-bottom{margin-top:auto}
.dots{display:flex;justify-content:center;gap:11px;margin:0 0 26px}
.dot{width:14px;height:14px;border-radius:50%;background:#dfe1e4}
.dot.active{background:#20c8df}
.form-note{text-align:right;color:#666;font-size:13px;margin-top:7px}

/* ---------- app ---------- */
.dashboard{display:grid;grid-template-columns:230px minmax(0,850px) 300px;gap:22px;max-width:1440px;margin:0 auto;min-height:100vh;padding:24px}
.rail{position:sticky;top:24px;height:calc(100vh - 48px);display:flex;flex-direction:column;padding:14px}
.brand-mini{display:flex;align-items:center;gap:11px;padding:12px 8px 22px}
.brand-logo{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-family:Nunito;font-weight:900;font-size:20px;box-shadow:var(--shadow)}
.brand-name{font-family:Nunito;font-weight:900}
.brand-sub{font-size:9px;color:#7b8490;letter-spacing:1px;margin-top:2px}
.rail-links{display:grid;gap:7px}
.rail-link{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;background:transparent;color:#555d68;font-weight:700}
.rail-link.active{background:#fff;box-shadow:var(--shadow);color:#17191e}
.rail-link .ico{width:28px;text-align:center;font-size:18px}
.rail-user{margin-top:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#ffe3b2;display:grid;place-items:center;font-size:23px}
.user-name{font-weight:800;font-size:13px}.user-sub{font-size:10px;color:#8a9098}
.main{min-width:0;padding:4px 0 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}
.page-title{font-family:Nunito;font-size:31px;font-weight:900;margin:0}
.page-sub{color:#747b85;font-size:12px;margin-top:3px}
.menu-btn{width:48px;height:48px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:20px;box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid rgba(35,40,50,.10);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.hero{padding:20px;margin-bottom:20px}
.hero-head{display:flex;justify-content:space-between;align-items:center}
.hero-label{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#7a818c}
.hero-time{font-family:Nunito;font-size:54px;font-weight:900;letter-spacing:-2px;margin:8px 0}
.hero-sub{font-size:12px;color:#6d7480}
.subject-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.section-title{font-family:Nunito;font-size:19px;font-weight:900}
.add-head{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 12px;font-weight:800;font-size:12px}
.subject-list{display:grid;gap:10px}
.subject-card{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;padding:9px 12px 9px 9px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 18px rgba(50,60,75,.08)}
.subject-card:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(50,60,75,.13)}
.subject-color{height:58px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:20px}
.subject-name{font-family:Nunito;font-size:18px;font-weight:900}
.subject-time{font-size:11px;color:#7a8089;margin-top:3px}
.subject-more{width:38px;height:38px;border-radius:12px;background:#f7f8fa;font-size:19px}
.chart-card{padding:18px;margin-top:22px}
.chart-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}
.chart-total{font-family:Nunito;font-size:23px;font-weight:900}
.chart-wrap{height:250px}
.activity{margin-top:22px}
.activity-row{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:8px}
.activity-name{font-weight:800}.activity-time{font-size:11px;color:#7c828b}
.right{padding-top:62px}
.side-card{padding:18px;margin-bottom:12px}
.side-title{display:flex;justify-content:space-between;align-items:center;font-family:Nunito;font-weight:900}
.task-add{display:grid;grid-template-columns:1fr 78px 42px;gap:7px;margin-top:14px}
.task-add input,.task-add button,.profile-field input,.profile-field textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px}
.task-add button{background:#111;color:#fff}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid #a7adb6;background:#fff;cursor:pointer}
.task.done .check{background:#45b95c;border-color:#45b95c;color:#fff}.task.done .task-text{text-decoration:line-through;color:#9ca1a8}
.target-big{font-family:Nunito;font-size:30px;font-weight:900;margin:8px 0}
.progress{height:10px;background:#e9ebef;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#58c9ed,#9d36c5);border-radius:inherit}

/* ---------- pages ---------- */
.profile-page,.target-page{display:grid;gap:14px}
.profile-card{padding:18px}
.profile-top{display:flex;align-items:center;gap:14px}
.profile-avatar{width:86px;height:86px;border-radius:24px;object-fit:cover;background:#ffe6b7;display:grid;place-items:center;font-size:40px}
.profile-name{font-family:Nunito;font-size:22px;font-weight:900}.handle{font-size:12px;color:#7c838d}
.bio{margin:18px 0 0;color:#454b55;line-height:1.5}
.note{margin-top:12px;padding:12px;border-radius:15px;background:#fff8a9;font-size:13px}
.edit-grid{display:grid;gap:10px;margin-top:16px}
.profile-field label{font-size:10px;font-weight:900;letter-spacing:1px;color:#7c838d;display:block;margin:0 0 5px 4px}
.profile-field textarea{min-height:90px;resize:vertical}
.save-btn{height:48px;border-radius:15px;background:#111;color:#fff;font-weight:800}
.upload-btn{height:44px;border-radius:13px;background:#eef8ff;border:1px solid #cbeefb;font-weight:800}
.target-card{padding:20px}
.target-input{height:54px;border:1px solid var(--line);border-radius:15px;padding:0 15px;width:100%;background:#fff;font-size:16px}
.set-target{height:48px;border-radius:15px;background:var(--yellow);font-weight:900;width:100%;margin-top:10px}

/* ---------- timer ---------- */
.timer-modal{position:fixed;inset:0;background:rgba(18,21,27,.36);backdrop-filter:blur(12px);z-index:50;display:grid;place-items:center;padding:20px}
.timer-box{width:min(520px,100%);background:#fff;border-radius:32px;padding:22px;box-shadow:0 35px 80px rgba(0,0,0,.25);text-align:center}
.timer-top{display:flex;justify-content:space-between;align-items:center}.timer-subject{font-family:Nunito;font-size:21px;font-weight:900}
.close-round{width:42px;height:42px;border-radius:50%;background:#f4f5f7;font-size:20px}
.duration-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}
.duration{padding:9px 14px;border-radius:14px;background:#f1f3f5;font-weight:800;font-size:12px}.duration.active{background:#111;color:#fff}
.clock{width:260px;height:260px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:radial-gradient(circle,#fff 62%,#f0f3f5 63%,#fff 66%);box-shadow:0 16px 34px rgba(0,0,0,.12);border:8px solid #f8f9fa}
.clock strong{font-family:Nunito;font-size:42px;letter-spacing:1px}.clock small{display:block;color:#888}
.timer-actions{display:flex;justify-content:center;gap:10px}.timer-action{width:82px;height:58px;border-radius:18px;background:#f2f3f5;font-weight:900}.timer-action.primary{background:#111;color:#fff}
.complete-modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,18,23,.20);backdrop-filter:blur(7px);z-index:80}
.complete-box{width:min(420px,calc(100% - 30px));background:#fff;border:2px solid #171717;border-radius:28px;padding:25px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.28);animation:pop .55s cubic-bezier(.16,1.4,.4,1)}
.complete-art{font-size:74px;animation:bounce .8s ease both}.complete-title{font-family:Nunito;font-size:27px;font-weight:900}.complete-time{display:inline-block;border:2px solid #bd75d1;border-radius:18px;padding:8px 18px;font-weight:900;color:#702083}
.complete-actions{display:grid;gap:9px;margin-top:18px}.complete-actions button{height:48px;border-radius:14px;background:#e8c5ef;font-weight:900}
.complete-actions button:last-child{background:#fff;border:1px solid #c98ad8}
.confetti{position:fixed;width:10px;height:18px;top:-30px;z-index:90;border-radius:5px;animation:fall 2.7s linear forwards}

/* ---------- bottom nav ---------- */
.mobile-nav{display:none}
.desktop-add{display:block}
@keyframes pop{from{transform:scale(.78);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{0%{transform:translateY(18px) scale(.7)}65%{transform:translateY(-8px) scale(1.08)}100%{transform:none}}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
@media(max-width:1050px){
  .dashboard{grid-template-columns:190px minmax(0,1fr);max-width:1000px}
  .right{display:none}
}
@media(max-width:700px){
  body{background:#f7fcff}
  .dashboard{display:block;min-height:100vh;padding:0 14px 105px}
  .rail{display:none}
  .main{padding:14px 0 30px}
  .topbar{margin:5px 2px 16px}.page-title{font-size:27px}.page-sub{font-size:11px}
  .menu-btn{width:44px;height:44px;border-radius:15px}
  .hero{border-radius:22px;padding:17px}.hero-time{font-size:44px}
  .subject-head{margin-top:20px}
  .subject-card{grid-template-columns:62px 1fr auto}
  .subject-color{height:56px}
  .chart-card{border-radius:22px}.chart-wrap{height:220px}
  .mobile-nav{
    position:fixed;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;
    left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));
    height:68px;padding:6px;border-radius:24px;background:rgba(255,255,255,.90);
    border:1px solid rgba(30,35,45,.10);box-shadow:0 14px 38px rgba(39,51,68,.17);
    backdrop-filter:blur(22px);z-index:30;
  }
  .bottom-item{height:56px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9ca1aa;font-size:10px;font-weight:800}
  .bottom-item i{font-size:21px;font-style:normal;line-height:1}
  .bottom-item.active{color:#111;background:rgba(80,196,235,.13)}
  .bottom-item.add{color:#fff;background:#111;box-shadow:0 6px 14px rgba(0,0,0,.16)}
  .bottom-item.add small{color:#fff}
  .right{display:none}
  .timer-box{padding:18px;border-radius:28px}.clock{width:235px;height:235px}.clock strong{font-size:35px}
  .profile-top{align-items:flex-start}.profile-avatar{width:78px;height:78px}
  .profile-name{font-size:20px}
  .complete-box{border-radius:26px}
}
@media(min-width:701px){
  .onboard-card,.form-screen{background:rgba(255,255,255,.55);border:1px solid rgba(40,50,60,.08);border-radius:34px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== PREMIUM V2 OVERRIDES ===== */
:root{
  --ink:#111218;
  --muted:#707784;
  --accent:#8f36c9;
  --accent2:#42c8ef;
  --danger:#ff4d68;
  --danger-soft:rgba(255,77,104,.10);
}
.icon-svg{width:21px;height:21px;stroke-width:2.15;flex:0 0 auto}
.subject-icon-svg{width:25px;height:25px;stroke-width:2.2}
.icon-choice{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin-top:8px;
}
.icon-choice button{
  width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,50,70,.06);
}
.icon-choice button.active{border-color:#8f36c9;box-shadow:0 0 0 3px rgba(143,54,201,.12)}
.subject-menu-wrap{position:relative}
.subject-menu{
  position:absolute;right:0;top:44px;z-index:20;width:185px;padding:7px;
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 18px 45px rgba(28,34,44,.18);backdrop-filter:blur(18px);
}
.subject-menu button{
  width:100%;text-align:left;background:transparent;border-radius:11px;padding:10px 11px;
  font-weight:700;font-size:12px;
}
.subject-menu button:hover{background:#f5f6f8}
.danger-modal{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:rgba(18,20,25,.30);backdrop-filter:blur(13px);z-index:70}
.danger-box{
  width:min(390px,100%);padding:23px;border-radius:27px;
  background:rgba(255,255,255,.94);border:1px solid rgba(255,77,104,.25);
  box-shadow:0 30px 80px rgba(35,25,35,.25);animation:dangerIn .35s cubic-bezier(.2,1.25,.35,1)
}
.danger-icon{
  width:54px;height:54px;border-radius:17px;background:var(--danger-soft);color:var(--danger);
  display:grid;place-items:center;margin-bottom:13px
}
.danger-title{font-family:Nunito;font-size:22px;font-weight:900;margin:0 0 6px}
.danger-copy{font-size:13px;line-height:1.55;color:#666d77;margin:0}
.danger-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.danger-actions button{height:47px;border-radius:14px;font-weight:900}
.danger-cancel{background:#f2f3f5}
.danger-confirm{background:#ff4d68;color:#fff}
.target-start{
  width:100%;height:46px;border-radius:14px;margin-top:12px;
  background:#111;color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.13)
}
.target-start:hover{transform:translateY(-1px);box-shadow:0 11px 24px rgba(0,0,0,.17)}
.target-running{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border-radius:14px;background:#f5fbff;border:1px solid #d9f2fb;
  margin-top:11px;font-size:12px;font-weight:800
}
.google-btn{
  position:relative;overflow:hidden;
}
.google-btn::after{
  content:"";position:absolute;inset:0;transform:translateX(-110%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);

/* ============================================================
   CHAT INBOX FIX — Messenger-style viewport + internal scroll
   Only affects the Chats/Inbox UI.
   ============================================================ */

/* When Chats is open, the browser/page itself must not scroll.
   The inbox list and message area handle their own scrolling. */
body:has(.chat-inbox-page){
  overflow:hidden !important;
}

.dashboard:has(.chat-inbox-page){
  height:100vh !important;
  min-height:100vh !important;
  overflow:hidden !important;
}

.dashboard:has(.chat-inbox-page) .main{
  min-height:0 !important;
  height:100vh !important;
  padding-bottom:24px !important;
  overflow:hidden !important;
}

.chats-page.chat-inbox-page{
  height:calc(100vh - 48px) !important;
  min-height:0 !important;
  max-height:none !important;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
}

.chat-inbox-top{
  flex:0 0 auto !important;
}

.chat-inbox-shell{
  flex:1 1 auto !important;
  min-height:0 !important;
  height:auto !important;
  max-height:none !important;
  overflow:hidden !important;
}

.chat-inbox-sidebar{
  min-height:0 !important;
  overflow:hidden !important;
}

.chat-inbox-list{
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  scrollbar-gutter:stable;
}

.chat-inbox-window{
  min-height:0 !important;
  height:100% !important;
  overflow:hidden !important;
}

.chat-inbox-window .chat-window{
  min-height:0 !important;
  height:100% !important;
  overflow:hidden !important;
}

.chat-inbox-window .chat-messages{
  min-height:0 !important;
  flex:1 1 auto !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain;
  scrollbar-gutter:stable;
}

/* Fix message bubbles becoming extremely narrow / one-character wide. */
.chat-inbox-window .chat-bubble-row{
  width:100% !important;
  flex:0 0 auto !important;
  display:flex !important;
}

.chat-inbox-window .chat-bubble-wrap{
  width:fit-content !important;
  max-width:min(72%,500px) !important;
  min-width:0 !important;
  flex:0 0 auto !important;
}

.chat-inbox-window .chat-bubble{
  display:block !important;
  width:max-content !important;
  max-width:100% !important;
  min-width:44px !important;
  box-sizing:border-box !important;
}

.chat-inbox-window .chat-bubble-row.mine .chat-bubble-wrap{
  align-items:flex-end !important;
}

/* Keep the newest messages visible while older messages naturally
   move upward inside the message scroller, Messenger-style. */
.chat-inbox-window .chat-messages{
  scroll-behavior:auto;
}

/* No page scrollbar caused by the Chats screen itself. */
.chat-inbox-page *{
  scrollbar-width:thin;
}

/* Mobile: the chat remains a full-screen panel and only the
   conversation area scrolls. */
@media(max-width:700px){
  body:has(.chat-inbox-page){
    overflow:hidden !important;
  }

  .dashboard:has(.chat-inbox-page),
  .dashboard:has(.chat-inbox-page) .main{
    height:100dvh !important;
    min-height:100dvh !important;
    overflow:hidden !important;
  }

  .chats-page.chat-inbox-page{
    height:calc(100dvh - 20px) !important;
    overflow:hidden !important;
  }

  .chat-inbox-shell{
    min-height:0 !important;
    height:auto !important;
  }

  .chat-inbox-window .chat-bubble-wrap{
    max-width:82% !important;
  }

  .chat-inbox-window .chat-bubble{
    min-width:44px !important;
    max-width:100% !important;
  }
}


/* ============================================================
   CHAT INBOX FINAL FIXES
   - Followed users appear directly in Chats
   - Recent conversations first
   - No Explore load until Explore is opened
   - Explicit Follow only
   - Red unread badge on Chats navigation
   ============================================================ */
.chat-nav-wrap{position:relative;display:inline-flex;align-items:center;gap:7px}
.chat-unread-badge{display:none;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef233c;color:#fff;font:900 9px/18px Nunito;text-align:center;box-shadow:0 2px 7px rgba(239,35,60,.28)}

.chat-list-item.unread .chat-list-copy b{font-weight:1000}

/* ============================================================
   FINAL CHAT + TIMER POLISH
   - Ignore empty/legacy message documents in the renderer
   - Desktop hover actions; mobile long-press actions
   - Instagram-like animated reaction picker
   - No notification sound on initial chat load
   - Minimizable study timer that keeps running across sections
   ============================================================ */

.chat-bubble-wrap{position:relative}

.chat-hover-actions{
  position:absolute;
  top:-38px;
  right:0;
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 7px;
  border-radius:18px;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(20,25,35,.08);
  box-shadow:0 10px 28px rgba(20,28,38,.18);
  backdrop-filter:blur(18px);
  opacity:0;
  transform:translateY(5px) scale(.94);
  pointer-events:none;
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.8,.2,1);
  z-index:20;
}
.chat-bubble-row.mine .chat-hover-actions{right:0}
.chat-bubble-row:not(.mine) .chat-hover-actions{left:0;right:auto}
.chat-bubble-wrap:hover .chat-hover-actions,
.chat-bubble:focus-visible + .chat-hover-actions{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.chat-hover-actions button{
  width:30px;height:30px;border:0;border-radius:50%;
  background:#f4f5f7;display:grid;place-items:center;
  font-size:14px;cursor:pointer;
  transition:transform .16s ease,background .16s ease;
}
.chat-hover-actions button:hover{transform:scale(1.18);background:#e9edf2}
.chat-hover-actions .hover-reply{font-size:13px}
.chat-hover-actions .hover-delete{color:#ef476f}

.chat-reaction-picker{
  position:fixed;
  z-index:280;
  display:flex;
  align-items:center;
  gap:3px;
  padding:6px 8px;
  border-radius:25px;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(20,25,35,.08);
  box-shadow:0 18px 50px rgba(20,28,38,.22);
  backdrop-filter:blur(20px);
  transform-origin:center bottom;
  animation:igReactionPickerIn .20s cubic-bezier(.2,.9,.2,1) both;
}
.chat-reaction-picker button{
  width:38px;height:38px;
  border:0;background:transparent;border-radius:50%;
  font-size:23px;cursor:pointer;
  transform:translateY(8px) scale(.55);
  animation:igReactionItemIn .28s cubic-bezier(.2,1.45,.3,1) forwards;
}
.chat-reaction-picker button:nth-child(2){animation-delay:.018s}
.chat-reaction-picker button:nth-child(3){animation-delay:.036s}
.chat-reaction-picker button:nth-child(4){animation-delay:.054s}
.chat-reaction-picker button:nth-child(5){animation-delay:.072s}
.chat-reaction-picker button:nth-child(6){animation-delay:.09s}
.chat-reaction-picker button:hover{transform:scale(1.22)!important}
@keyframes igReactionPickerIn{
  from{opacity:0;transform:translateY(7px) scale(.72)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes igReactionItemIn{
  to{transform:translateY(0) scale(1)}
}
.chat-reaction-pop{
  position:absolute;
  z-index:25;
  pointer-events:none;
  font-size:23px;
  animation:igReactionPop .72s cubic-bezier(.18,.8,.22,1) both;
}
@keyframes igReactionPop{
  0%{opacity:0;transform:translateY(10px) scale(.3)}
  18%{opacity:1;transform:translateY(-2px) scale(1.25)}
  65%{opacity:1;transform:translateY(-27px) scale(1)}
  100%{opacity:0;transform:translateY(-48px) scale(.78)}
}

.timer-minimize-btn{
  min-width:38px;height:38px;border:0;border-radius:12px;
  background:#f2f3f5;font-weight:900;font-size:18px;cursor:pointer;

.chat-dialog-backdrop{

.persistent-timer-box .timer-subject{font:900 18px Nunito;display:flex;align-items:center;gap:8px}
.persistent-timer-box .clock{margin:24px auto;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;background:#fff;border:10px solid #f2f5f7;box-shadow:0 8px 30px rgba(30,40,50,.10)}
.persistent-timer-box .clock strong{display:block;font:900 38px Nunito;text-align:center}
.persistent-timer-box .clock small{display:block;text-align:center;color:#8a919b;margin-top:3px}
.persistent-timer-mini{position:fixed;right:22px;bottom:22px;display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;border-radius:18px;background:rgba(255,255,255,.97);border:1px solid rgba(20,25,35,.10);box-shadow:0 16px 45px rgba(20,28,38,.22);backdrop-filter:blur(18px)}
.persistent-timer-mini strong{font:900 14px Nunito;min-width:78px}
.persistent-timer-mini small{display:block;color:#8a919b;font-size:8px;font-weight:800}
.persistent-timer-mini button{border:0;border-radius:10px;height:34px;padding:0 10px;font-weight:900}
.persistent-timer-mini .open{background:#111;color:#fff}.persistent-timer-mini .close{background:#f2f3f5}
@media(max-width:700px){.persistent-timer-mini{right:12px;bottom:78px}.persistent-timer-box{padding:18px}.persistent-timer-box .clock{width:220px;height:220px}}


.chat-reaction-chip{position:relative;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.chat-reaction-chip:hover{transform:translateY(-1px)}
.chat-reaction-chip.mine-reaction{box-shadow:0 0 0 2px rgba(38,135,255,.16),0 2px 7px rgba(0,0,0,.10)}


/* ===== Email/password auth restored ===== */
.auth-methods{display:grid;gap:10px;margin-top:4px}
.auth-divider{display:flex;align-items:center;gap:9px;color:#9299a2;font-size:10px;font-weight:800}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e4e7eb;flex:1}
.email-auth-btn{height:54px;border-radius:28px;background:#111;color:#fff;font-size:15px;font-weight:900;box-shadow:0 7px 15px rgba(35,42,50,.12)}
.email-auth-secondary{height:50px;border-radius:25px;background:#f1f3f5;font-weight:900}
.email-auth-modal{position:fixed;inset:0;z-index:260;display:grid;place-items:center;padding:18px;background:rgba(20,24,30,.34);backdrop-filter:blur(12px)}

.email-auth-head h2{font:900 24px Nunito;margin:0}

.email-auth-tabs button{height:40px;border-radius:10px;font-weight:900;background:transparent}
.email-auth-tabs button.active{background:#111;color:#fff}
.email-auth-field{display:grid;gap:6px;margin-bottom:11px}
.email-auth-field label{font-size:10px;font-weight:900;color:#6d7580;text-transform:uppercase;letter-spacing:.6px}
.email-auth-field input{height:48px;border:1px solid #d8dce1;border-radius:13px;padding:0 13px;font-size:14px}
.email-auth-submit{width:100%;height:49px;border-radius:14px;background:#111;color:#fff;font-weight:900;margin-top:4px}

</style>

<body>
<div class="honeycomb"></div>
<div id="app" class="app-shell"></div><div id="persistentTimerHost" aria-live="polite"></div>

<script>

/* ============================================================
   STUDY CIRCLE — PREMIUM SINGLE FILE APP V2
   ============================================================
   This is a front-end simulation with localStorage persistence.
   You can connect Firebase/Auth/Firestore later without changing
   the UI architecture.
*/

const KEY="study_circle_state_v2";

/* ============================================================
   GOOGLE AUTH SETUP
   ------------------------------------------------------------
   REAL Google sign-in:
   1. Create a Firebase project.
   2. Enable Authentication > Google.
   3. Create a Web App and paste its config below.
   4. For cross-device cloud profile/data, enable Firestore too.
   If the config is left as YOUR_..., the app automatically uses
   the localStorage demo mode, so the UI still works.
============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqaGDE013miUh1CsJajj7_bG6xNLPv0h0",
  authDomain: "study-timer11.firebaseapp.com",
  projectId: "study-timer11",
  storageBucket: "study-timer11.firebasestorage.app",
  messagingSenderId: "72603722283",
  appId: "1:72603722283:web:0132b781b6fb325f25406e",
  measurementId: "G-P6F9YSY860"
};
let firebaseReady=false;
let firebaseUser=null;
let firestore=null;
let auth=null;

/* Firebase v10 compat bridge: keeps the existing single-file/global UI working
   while providing the same Firebase v10 Firestore operations used by Chats. */
function initializeApp(config){return firebase.initializeApp(config)}
function getApps(){return firebase.apps||[]}
function getAuth(){return firebase.auth()}
function getFirestore(){return firebase.firestore()}
function GoogleAuthProvider(){return new firebase.auth.GoogleAuthProvider()}
function signInWithPopup(a,p){return a.signInWithPopup(p)}
function onAuthStateChanged(a,cb){return a.onAuthStateChanged(cb)}
function collection(parent,name){return parent.collection(name)}
function doc(parent,name,id){return id===undefined?parent.doc(name):parent.collection(name).doc(id)}
function getDoc(ref){return ref.get()}
function setDoc(ref,data,options){return ref.set(data,options)}
function updateDoc(ref,data){return ref.update(data)}
function addDoc(ref,data){return ref.add(data)}
function deleteDoc(ref){return ref.delete()}
function getDocs(ref){return ref.get()}
function where(field,op,value){return {kind:"where",field,op,value}}
function orderBy(field,direction){return {kind:"orderBy",field,direction}}
function limit(n){return {kind:"limit",n}}
function query(base,...constraints){let q=base;for(const c of constraints){if(c.kind==="where")q=q.where(c.field,c.op,c.value);else if(c.kind==="orderBy")q=q.orderBy(c.field,c.direction);else if(c.kind==="limit")q=q.limit(c.n)}return q}
function onSnapshot(ref,success,error){return ref.onSnapshot(success,error)}
function runTransaction(db,fn){return db.runTransaction(fn)}
function serverTimestamp(){return firebase.firestore.FieldValue.serverTimestamp()}

function initFirebase(){
  try{
    const app=getApps().length?getApps()[0]:initializeApp(FIREBASE_CONFIG);
    auth=getAuth(app);
    firestore=getFirestore(app);
    firebaseReady=true;
    onAuthStateChanged(auth,async user=>{
      firebaseUser=user||null;
      if(user){
        const ref=doc(firestore,"users",user.uid);
        const snap=await getDoc(ref);
        if(snap.exists){
          const cloud=snap.data();
          state={...state,...cloud,authUid:user.uid,onboarding:cloud.onboarding||"done"};
          save();
          render();
        }else{
          state.authUid=user.uid;
          state.user.name=state.user.name||user.displayName||"";
          state.user.username=state.user.username||((user.email||"").split("@")[0]||"student");
          state.user.dp=state.user.dp||user.photoURL||"";
          save();
        }
        await syncPublicProfile();
      }
    });
  }catch(err){console.warn("Firebase disabled:",err);firebaseReady=false;}
}
async function syncCloud(){
  if(!firebaseReady||!firebaseUser||!firestore)return;
  try{await setDoc(doc(firestore,"users",firebaseUser.uid),state,{merge:true});}
  catch(err){console.warn("Cloud sync failed:",err)}
}
async function syncPublicProfile(){
  return publishMyPublicProfile();
}
initFirebase();

const DEFAULT_SUBJECTS=[
  {id:crypto.randomUUID(),name:"Bangla",icon:"book-open",color:"#8f36c9",seconds:0},
  {id:crypto.randomUUID(),name:"English",icon:"graduation-cap",color:"#ef2670",seconds:0},
  {id:crypto.randomUUID(),name:"Math",icon:"calculator",color:"#e2c51a",seconds:0}
];

let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  onboarding:"welcome",
  user:{name:"",username:"",birthday:"",dp:"",bio:""},
  note:{text:"",expires:0,bg:"sunset"},
  target:{minutes:480,done:0,date:"",running:false,startedAt:0},
  subjects:DEFAULT_SUBJECTS,
  sessions:[],
  tasks:[],
};

if(!state.subjects?.length) state.subjects=DEFAULT_SUBJECTS;

/* migrate older localStorage data */
state.subjects = (state.subjects||[]).map(s=>{
  const map={"📖":"book-open","🎓":"graduation-cap","🧮":"calculator","📚":"book-open"};
  return {...s,icon:map[s.icon]||s.icon||"book-open"};
});
state.target = {...{minutes:480,done:0,date:"",running:false,startedAt:0},...(state.target||{})};

let chart=null;
let timer=null;
let timerMinimized=false;
let timerState={subject:null,remaining:0,total:0,running:false,startedAt:0};

function save(){localStorage.setItem(KEY,JSON.stringify(state)); syncCloud(); if(firebaseReady&&firebaseUser) syncPublicProfile()}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h)return `${h}h ${m}m`;
  if(m)return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function totalFocus(){return state.subjects.reduce((a,s)=>a+(s.seconds||0),0)}
function todayKey(){return new Date().toISOString().slice(0,10)}
function avatarHTML(size="avatar"){
  if(state.user.dp)return `<img class="${size}" src="${esc(state.user.dp)}" alt="Profile">`;
  return `<div class="${size}">🙂</div>`;
}

/* ---------- onboarding ---------- */
function render(){
  if(state.onboarding!=="done") renderOnboarding();
  else renderApp();
}
function renderOnboarding(){
  const root=document.getElementById("app");
  if(state.onboarding==="welcome"){
    root.innerHTML=`
      <main class="onboarding page">
        <section class="onboard-card">
          <div class="brand-art">
            <div class="brand-note">Study<br>Circle</div>
            <div class="hedgehog">🦔</div>
          </div>
          <h1 class="onboard-title">Study Circle is a focus app to enjoy studying.</h1>
          <p class="onboard-copy">If you are having a hard time finding the motivation to study, or if you feel anxious about studying alone, this is the app for you.</p>
          <div class="onboard-actions auth-methods">
            <button class="primary-btn google-btn" onclick="startGoogle()">
              <span class="google-mark">G</span><span>Continue with Google</span>
            </button>
            <div class="auth-divider"><span>OR</span></div>
            <button class="email-auth-btn" onclick="openEmailAuth('login')">Log in with Email</button>
            <button class="email-auth-secondary" onclick="openEmailAuth('signup')">Create an account</button>
            <div class="auth-badge"><span class="google-mark">G</span> Your study data stays saved to your account</div>
          </div>
        </section>
      </main>`;
  }else{
    const step=state.onboarding;
    const meta={
      name:{title:"Your name",help:"Tell us what we should call you.",placeholder:"Your name",next:"username"},
      username:{title:"Your username",help:"Choose a username you like. You can change it later.",placeholder:"@username",next:"birthday"},
      birthday:{title:"Your birthday",help:"Add your birthday to complete your profile.",placeholder:"",next:"done"}
    }[step];
    root.innerHTML=`
      <main class="onboarding page">
        <section class="form-screen">
          <button class="back-btn" onclick="goBackOnboard()">‹</button>
          <h1 class="form-title">${meta.title}</h1>
          <p class="form-help">${meta.help}</p>
          ${step==="birthday"
            ? `<input id="onboardInput" class="big-input" type="date" value="${esc(state.user.birthday)}">`
            : `<input id="onboardInput" class="big-input" maxlength="${step==="name"?30:20}" placeholder="${meta.placeholder}" value="${esc(step==="name"?state.user.name:state.user.username)}">`}
          ${step!=="birthday"?`<div class="form-note"><span id="charCount">0</span>/30</div>`:""}
          <div class="form-bottom">
            <div class="dots">
              <i class="dot"></i><i class="dot active"></i><i class="dot"></i><i class="dot"></i>
            </div>
            <button class="primary-btn" onclick="nextOnboard()">Next</button>
          </div>
        </section>
      </main>`;
    const inp=document.getElementById("onboardInput");
    if(inp)inp.addEventListener("input",()=>{const c=document.getElementById("charCount");if(c)c.textContent=inp.value.length});
  }
}
async function startGoogle(){
  if(firebaseReady){
    try{
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await signInWithPopup(auth,provider);
      state.authUid = auth.currentUser?.uid || "";
      state.user.name = state.user.name || auth.currentUser?.displayName || "";
      state.user.dp = state.user.dp || auth.currentUser?.photoURL || "";
      state.user.username = state.user.username || (auth.currentUser?.email||"").split("@")[0];
      state.onboarding = state.user.name ? "username" : "name";
      save(); render();
      return;
    }catch(err){
      console.error(err);
      alert("Google sign-in could not finish. Check your Firebase Google provider and authorized domain.");
      return;
    }
  }
  /* Local demo fallback:
     Without Firebase config this keeps the account/data persistent
     in this browser using localStorage. */
  state.onboarding="name"; save(); render();
}

let emailAuthMode="login";
function openEmailAuth(mode="login"){
  emailAuthMode=mode==="signup"?"signup":"login";
  const host=document.getElementById("modalHost");if(!host)return;
  host.innerHTML=`
    <div class="email-auth-modal" onclick="if(event.target===this)closeEmailAuth()">
      <section class="email-auth-box" role="dialog" aria-modal="true">
        <div class="email-auth-head">
          <h2>${emailAuthMode==="signup"?"Create your account":"Welcome back"}</h2>
          <button class="close-round" onclick="closeEmailAuth()">×</button>
        </div>
        <div class="email-auth-tabs">
          <button class="${emailAuthMode==="login"?"active":""}" onclick="switchEmailAuth('login')">Log in</button>
          <button class="${emailAuthMode==="signup"?"active":""}" onclick="switchEmailAuth('signup')">Sign up</button>
        </div>
        <div class="email-auth-field"><label>Email</label><input id="emailAuthEmail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(state.user.email||"")}"></div>
        <div class="email-auth-field"><label>Password</label><input id="emailAuthPassword" type="password" autocomplete="${emailAuthMode==="signup"?"new-password":"current-password"}" placeholder="At least 6 characters"></div>
        <button class="email-auth-submit" onclick="submitEmailAuth()">${emailAuthMode==="signup"?"Create account":"Log in"}</button>
        <p class="email-auth-help">Use the same email/password you registered with in Study Circle.</p>
      </section>
    </div>`;
}
function switchEmailAuth(mode){openEmailAuth(mode)}
function closeEmailAuth(){const h=document.getElementById("modalHost");if(h)h.innerHTML=""}
async function submitEmailAuth(){
  const email=(document.getElementById("emailAuthEmail")?.value||"").trim().toLowerCase();
  const password=document.getElementById("emailAuthPassword")?.value||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){
    showChatDialog({title:"Invalid email",message:"Please enter a valid email address.",icon:"✉️",confirmText:"OK"});return;
  }
  if(password.length<6){
    showChatDialog({title:"Password too short",message:"Password must be at least 6 characters.",icon:"🔒",confirmText:"OK"});return;
  }
  if(!firebaseReady||!auth){
    showChatDialog({title:"Email login unavailable",message:"Firebase Authentication is not connected. Enable Email/Password in Firebase Authentication first.",icon:"⚠️",danger:true,confirmText:"OK"});return;
  }
  try{
    const credential=emailAuthMode==="signup"
      ?await auth.createUserWithEmailAndPassword(email,password)
      :await auth.signInWithEmailAndPassword(email,password);
    const u=credential.user;
    state.authUid=u?.uid||"";
    state.user.email=u?.email||email;
    state.user.name=state.user.name||u?.displayName||"";
    state.user.dp=state.user.dp||u?.photoURL||"";
    if(!state.user.username&&u?.email){
      state.user.username=(u.email.split("@")[0]||"student").replace(/[^a-zA-Z0-9._-]/g,"");
      await claimUsername(state.user.username);
    }
    closeEmailAuth();
    state.onboarding=state.user.name?"done":"name";
    save();render();
  }catch(err){
    console.error("Email auth failed",err);
    const code=err?.code||"";
    const msg=code==="auth/email-already-in-use"?"This email is already registered. Use Log in instead."
      :code==="auth/invalid-credential"||code==="auth/wrong-password"||code==="auth/user-not-found"?"Email or password is incorrect."
      :code==="auth/weak-password"?"Choose a stronger password."
      :err?.message||"Email authentication could not be completed.";
    showChatDialog({title:emailAuthMode==="signup"?"Sign up failed":"Login failed",message:msg,icon:"⚠️",danger:true,confirmText:"OK"});
  }
}

function nextOnboard(){
  const v=document.getElementById("onboardInput").value.trim();
  if(state.onboarding==="name"){if(!v)return alert("Please enter your name.");state.user.name=v;state.onboarding="username"}
  else if(state.onboarding==="username"){if(!v)return alert("Please choose a username.");state.user.username=v.replace(/^@/,"");state.onboarding="birthday"}
  else {if(!v)return alert("Please choose your birthday.");state.user.birthday=v;state.onboarding="done"}
  save();render();
}
function goBackOnboard(){
  if(state.onboarding==="name")state.onboarding="welcome";
  else if(state.onboarding==="username")state.onboarding="name";
  else if(state.onboarding==="birthday")state.onboarding="username";
  save();render();
}

/* ---------- app ---------- */
function getInitialActivePage(){
  try{
    const nav=performance.getEntriesByType("navigation")[0];
    const isReload=nav && nav.type==="reload";
    if(isReload)return sessionStorage.getItem("study_circle_active_page")||"home";
    sessionStorage.removeItem("study_circle_active_page");
  }catch(err){}
  return "home";
}
let activePage=getInitialActivePage();
function renderApp(){
  document.getElementById("app").innerHTML=`
    <main class="dashboard page">
      <aside class="rail">
        <div class="brand-mini">
          <div class="brand-logo">S</div>
          <div><div class="brand-name">Study Circle</div><div class="brand-sub">FOCUS • STUDY</div></div>
        </div>
        <nav class="rail-links">
          <button class="rail-link ${activePage==="home"?"active":""}" onclick="navigate('home')"><span class="ico"><i data-lucide="house" class="icon-svg"></i></span>Home</button>
          <button class="rail-link ${activePage==="add"?"active":""}" onclick="navigate('add')"><span class="ico"><i data-lucide="plus" class="icon-svg"></i></span>Add</button>
          <button class="rail-link ${activePage==="target"?"active":""}" onclick="navigate('target')"><span class="ico"><i data-lucide="target" class="icon-svg"></i></span>Target</button>
          <button class="rail-link ${activePage==="chats"?"active":""}" onclick="navigate('chats')"><span class="ico"><i data-lucide="messages-square" class="icon-svg"></i></span><span class="chat-nav-wrap">Chats<span class="chat-unread-badge" data-chat-unread-badge></span></span></button>
          <button class="rail-link ${activePage==="profile"?"active":""}" onclick="navigate('profile')"><span class="ico"><i data-lucide="user-round" class="icon-svg"></i></span>Profile</button>
        </nav>
        <div class="rail-user">${avatarHTML("avatar")}<div><div class="user-name">${esc(state.user.name||"Study User")}</div><div class="user-sub">@${esc(state.user.username||"student")}</div></div></div>
      </aside>

      <section class="main">
        ${activePage==="home"?homePage():activePage==="add"?addPage():activePage==="target"?targetPage():activePage==="chats"?chatsPage():profilePage()}
      </section>

      <aside class="right">
        ${sideToday()}
        ${sideTarget()}
      </aside>

      <nav class="mobile-nav">
        <button class="bottom-item ${activePage==="home"?"active":""}" onclick="navigate('home')"><i data-lucide="house"></i><small>Home</small></button>
        <button class="bottom-item add ${activePage==="add"?"active":""}" onclick="navigate('add')"><i data-lucide="plus"></i><small>Add</small></button>
        <button class="bottom-item ${activePage==="target"?"active":""}" onclick="navigate('target')"><i data-lucide="target"></i><small>Target</small></button>
        <button class="bottom-item ${activePage==="chats"?"active":""}" onclick="navigate('chats')"><i data-lucide="messages-square"></i><small class="chat-nav-wrap">Chats<span class="chat-unread-badge" data-chat-unread-badge></span></small></button>
        <button class="bottom-item ${activePage==="profile"?"active":""}" onclick="navigate('profile')"><i data-lucide="user-round"></i><small>Profile</small></button>
      </nav>
    </main>
    <div id="modalHost"></div>`;
  drawChart();
  if(window.lucide) lucide.createIcons();
  setTimeout(()=>{ensureChatUnreadListener();updateChatUnreadBadges();syncPersistentTimerVisibility()},0);
}
function navigate(page){
  if(activePage==="chats" && page!=="chats")stopChatListeners();
  activePage=page;
  try{sessionStorage.setItem("study_circle_active_page",page)}catch(err){}
  renderApp();
  syncPersistentTimerVisibility();
  if(window.lucide)lucide.createIcons();
  window.scrollTo({top:0,behavior:"smooth"});
  if(page==="chats")setTimeout(initChatsPage,0);
}

function homePage(){
  const total=totalFocus();
  return `
    <div class="topbar">
      <div><h1 class="page-title">Timer</h1><div class="page-sub">Make a little progress every day.</div></div>
      <button class="menu-btn" onclick="showHelp()">☰</button>
    </div>
    <section class="card hero">
      <div class="hero-head"><span class="hero-label">TODAY'S FOCUS</span><span class="hero-sub">${new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span></div>
      <div class="hero-time">${fmt(total)}</div>
      <div class="hero-sub">Your total study time across all subjects.</div>
    </section>
    <div class="subject-head">
      <div class="section-title">Subjects</div>
      <button class="add-head" onclick="navigate('add')">＋ Add subject</button>
    </div>
    <section class="subject-list">${state.subjects.map(subjectCard).join("")}</section>
    <section class="card chart-card">
      <div class="chart-head">
        <div><div class="hero-label">FOCUS BREAKDOWN</div><div class="chart-total">${fmt(total)}</div></div>
        <span class="hero-sub">By subject</span>
      </div>
      <div class="chart-wrap"><canvas id="focusChart"></canvas></div>
    </section>

function toggleTimer(){
  if(timerState.running){pauseTimer();return}

      clearInterval(timer);timer=null;timerState.running=false;completeTimer();

  },1000);

/* Local username uniqueness + Firestore username reservation when configured. */
async function claimUsername(username){
  const clean=String(username||"").trim().replace(/^@/,"").toLowerCase();
  if(!clean)return false;
  const ownerKey="study_circle_username_registry_v1";
  let registry=JSON.parse(localStorage.getItem(ownerKey)||"{}");
  const me=state.authUid||state.user.email||"local-user";
  if(registry[clean] && registry[clean]!==me)return false;
  if(firebaseReady&&firestore){
    try{
      const ref=doc(firestore,"usernames",clean);
      await runTransaction(firestore,async tx=>{
        const snap=await tx.get(ref);
        if(snap.exists && snap.data().uid!==me)throw new Error("USERNAME_TAKEN");
        tx.set(ref,{uid:me,username:clean,updatedAt:serverTimestamp()},{merge:true});
      });
    }catch(e){if(e.message==="USERNAME_TAKEN")return false;console.warn(e)}
  }
  registry[clean]=me;localStorage.setItem(ownerKey,JSON.stringify(registry));
  return true;
}

async function startGoogle(){
  if(!firebaseReady||!auth){
    return alert("Firebase is not connected. Enable Google Sign-in and check your Firebase configuration.");
  }
  try{
    const provider=new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    await signInWithPopup(auth,provider);
    const u=auth.currentUser;
    state.authUid=u?.uid||"";state.user.email=u?.email||"";state.user.name=state.user.name||u?.displayName||"";state.user.dp=state.user.dp||u?.photoURL||"";
    if(!state.user.username && u?.email){state.user.username=(u.email.split("@")[0]||"student").replace(/[^a-zA-Z0-9._-]/g,"");await claimUsername(state.user.username)}
    state.onboarding=state.user.name?"username":"name";save();render();
  }catch(err){console.error("Google auth",err);alert("Google sign-in could not finish. Check Firebase Authentication > Google and your authorized domain.");}
}

let exploreUsers=[];

async function publishMyPublicProfile(){
  if(!firebaseReady||!firebaseUser||!firestore)return false;
  try{
    const u=state.user||{};
    const username=String(u.username||"").trim().replace(/^@/,'').toLowerCase();
    if(!username)return false;
    const totalSeconds=(state.sessions||[]).reduce((sum,x)=>sum+Math.max(0,Number(x.seconds)||0),0);
    const subjectBreakdown=(state.subjects||[]).map(s=>({name:s.name,seconds:Math.max(0,Number(s.seconds)||0)})).filter(x=>x.seconds>0).sort((a,b)=>b.seconds-a.seconds).slice(0,8);
    const topSubject=subjectBreakdown[0]?.name||"No subject yet";
    let followingCount=Number(u.followingCount)||0;
    try{followingCount=(await getDocs(collection(firestore,"publicProfiles",firebaseUser.uid,"following"))).size}catch(e){}
    await setDoc(doc(firestore,"publicProfiles",firebaseUser.uid),{
      uid:firebaseUser.uid,
      name:u.name||firebaseUser.displayName||"Study User",
      username,
      usernameLower:username,
      dp:u.dp||firebaseUser.photoURL||"",
      bio:u.bio||"",
      studyStatus:(timerState?.running||state.target?.running)?"Studying":"Available",
      totalSeconds,
      subjectBreakdown,
      topSubject,
      followingCount,
      updatedAt:serverTimestamp()
    },{merge:true});
    return true;
  }catch(err){
    console.warn("Public profile publish failed:",err);
    return false;
  }
}

async function loadExploreUsers(){
  const host=document.getElementById("chatExploreResults")||document.getElementById("exploreResults");
  if(!host||!firebaseReady||!firestore||!currentUid()){
    if(host)host.innerHTML=`<div class="chat-list-empty">Log in with Google or Email first to explore users.</div>`;
    return;
  }
  host.innerHTML=`<div class="chat-list-empty">Loading users…</div>`;
  try{
    const snap=await getDocs(query(collection(firestore,"publicProfiles"),orderBy("usernameLower"),limit(100)));
    exploreUsers=snap.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.uid!==currentUid());
    exploreLoaded=true;
    renderExploreUsers(exploreUsers);
  }catch(err){
    console.warn("Explore users failed",err);
    host.innerHTML=`<div class="chat-list-empty">Users could not load. Check Firestore rules for publicProfiles.</div>`;

let chatReadTimes={};
try{chatReadTimes=JSON.parse(localStorage.getItem("study_circle_chat_reads_v1")||"{}")}catch(e){chatReadTimes={}}
function saveChatReadTimes(){try{localStorage.setItem("study_circle_chat_reads_v1",JSON.stringify(chatReadTimes))}catch(e){}}
function chatUpdatedMillis(ts){return ts?.toMillis?.()||ts?.seconds*1000||Number(ts)||0}
function markChatRead(chatId){
  if(!chatId)return;
  chatReadTimes[chatId]=Date.now();
  saveChatReadTimes();
  updateChatUnreadBadges();
}
function isChatUnread(row){
  if(!row||!currentUid())return false;
  const sender=row.lastMessageSenderId||row.lastSenderId||"";
  if(!sender||sender===currentUid())return false;
  const updated=chatUpdatedMillis(row.updatedAt);
  const read=Number(chatReadTimes[row.id]||0);
  return updated>read;
}
function updateChatUnreadBadges(){

function playMessageSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type="sine";
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(1175,ctx.currentTime+0.08);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.28);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.3);
  }catch(e){}
}

function messageBelongsToChat(m, chatId, me, other){
  if(!m)return false;
  // Prefer explicit pair check
  const s=m.senderId, r=m.receiverId;
  if(s&&r){
    return (s===me&&r===other)||(s===other&&r===me);
  }
  return true; // legacy messages without receiverId
}

function loadChatList(){
  if(chatListUnsub)try{chatListUnsub()}catch(e){}
  const host=document.getElementById("chatList");if(!host||!firebaseReady||!firestore||!currentUid())return;
  host.innerHTML=`<div class="chat-list-empty">Loading conversations…</div>`;
  const me=currentUid();
  const chatsQ=query(collection(firestore,"chats"),where("participants","array-contains",me),limit(80));
  chatListUnsub=onSnapshot(chatsQ,async snap=>{
    try{
      const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>chatUpdatedMillis(b.updatedAt)-chatUpdatedMillis(a.updatedAt));
      chatListItems=rows;

      // Fetch followed users and chat profiles in parallel so the inbox does
      // not require Explore before showing people the user has already added.
      const chatOtherIds=rows.map(r=>(r.participants||[]).find(x=>x!==me)).filter(Boolean);
      const followingSnap=await getDocs(collection(firestore,"publicProfiles",me,"following"));
      const followingIds=followingSnap.docs.map(d=>d.id).filter(uid=>uid!==me);
      const allIds=[...new Set([...chatOtherIds,...followingIds])];

      const uncached=allIds.filter(uid=>!chatListProfilesCache[uid]);
      if(uncached.length){
        const profiles=await Promise.all(uncached.map(async uid=>{
          try{
            const s=await getDoc(doc(firestore,"publicProfiles",uid));
            return s.exists?{uid:s.id,...s.data()}:null;
          }catch(e){return null}
        }));
        profiles.filter(Boolean).forEach(u=>chatListProfilesCache[u.uid]=u);
      }

      const chatByUid=new Map();
      rows.forEach(row=>{
        const other=(row.participants||[]).find(x=>x!==me);
        if(other)chatByUid.set(other,row);
      });

      const chatUsers=chatOtherIds.map(uid=>({uid,row:chatByUid.get(uid),user:chatListProfilesCache[uid]||{uid,name:"Study User",username:"unknown",dp:""}}));
      const chatUidSet=new Set(chatUsers.map(x=>x.uid));
      const followedOnly=followingIds.filter(uid=>!chatUidSet.has(uid)).map(uid=>({uid,row:null,user:chatListProfilesCache[uid]||{uid,name:"Study User",username:"unknown",dp:""}}));

      // Recent conversations first; followed users without a conversation are
      // shown after them, so the inbox feels like Messenger.
      const merged=[...chatUsers,...followedOnly];
      if(!merged.length){
        host.innerHTML=`<div class="chat-list-empty">No chats yet.<br>Follow someone or search a username to start a conversation.</div>`;
        updateChatUnreadBadges();
        return;
      }
      host.innerHTML=merged.map(({row,user})=>{
        const unread=isChatUnread(row);
        return `<div class="chat-list-item ${selectedChatId===row?.id?"active":""} ${unread?"unread":""}" onclick="openChat('${esc(user.uid)}')">
          ${chatAvatarHTML(user)}
          <div class="chat-list-copy"><b>${esc(user.name||"Study User")}</b><small>${esc(row?.lastMessage||"Start a conversation")}</small></div>
          ${row?.updatedAt?`<small style="font-size:9px;color:#9aa1aa;align-self:flex-start">${formatChatTime(row.updatedAt)}</small>`:""}
          <span class="chat-list-unread-dot" aria-label="Unread message"></span>
        </div>`;
      }).join("");
      updateChatUnreadBadges();
    }catch(err){
      console.warn("Chat list listener failed",err);
      host.innerHTML=`<div class="chat-list-empty">Chats could not load. Check your Firestore rules.</div>`;
    }
  },err=>{
    console.warn("Chat list listener failed",err);
    host.innerHTML=`<div class="chat-list-empty">Chats could not load. Check your Firestore rules.</div>`;
  });
}

async function openChat(otherUid){

    activePage="chats";
    try{sessionStorage.setItem("study_circle_active_page","chats")}catch(e){}
    renderApp();
    await new Promise(r=>setTimeout(r,60));
  }

  try{switchChatTab("search")}catch(e){}

  const user=chatListProfilesCache[otherUid] || await fetchPublicProfile(otherUid);
  if(!user){alert("This user profile could not be loaded.");return;}

  selectedChatUser=user;
  selectedChatId=chatIdFor(currentUid(),otherUid);
  markChatRead(selectedChatId);

  await refreshBlockState(otherUid);
  renderChatWindow();

  const msgHost=document.getElementById("chatMessages");
  if(msgHost)msgHost.innerHTML=`<div class="chat-empty">Loading messages…</div>`;

  subscribeToMessages(selectedChatId);
  loadChatList();
  setMobileChatOpen(true);
}

  closeChatActionMenu();
  closeReactionPicker();
  if(!firestore||!selectedChatId||!currentUid()||!id)return;
  try{
    const ref=doc(firestore,"chats",selectedChatId,"messages",id);
    const snap=await getDoc(ref);
    if(!snap.exists)return;
    const m=snap.data()||{};
    const reactions={...(m.reactions||{})};
    const list=Array.isArray(reactions[emoji])?[...reactions[emoji]]:[];
    const uid=currentUid();
    const i=list.indexOf(uid);
    if(i>=0)list.splice(i,1);else list.push(uid);
    if(list.length)reactions[emoji]=list;else delete reactions[emoji];
    // Merge keeps every other message field untouched.
    await setDoc(ref,{reactions},{merge:true});
    const bubble=document.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
    if(bubble)showReactionPop(bubble,emoji);
  }catch(err){
    console.warn("Reaction update failed",err);
    chatWarning("Reaction failed","Your reaction could not be saved right now. Please try again.","😕");
  }
}
async function deleteChatMessage(id){
  closeChatActionMenu();
  closeReactionPicker();
  if(!firestore||!selectedChatId||!currentUid()||!id)return;
  showChatDialog({
    title:"Delete message?",
    message:"This message will be permanently removed from this conversation.",
    icon:"🗑️",
    danger:true,
    confirmText:"Delete",
    cancelText:"Cancel",
    onConfirm:async()=>{
      try{
        const ref=doc(firestore,"chats",selectedChatId,"messages",id);
        const snap=await getDoc(ref);
        if(!snap.exists)return;
        if(snap.data()?.senderId!==currentUid()){
          chatWarning("Can't delete this message","You can only delete messages that you sent.","🔒");
          return;
        }
        await deleteDoc(ref);
      }catch(err){
        console.warn("Delete message failed",err);
        chatWarning("Delete failed","The message could not be deleted. Please try again.","⚠️");
      }
    }
  });
}
function bindChatMessagePress(el,message){
  el.__message=message;
  let timer=null;
  let moved=false;
  el.addEventListener("touchstart",e=>{
    moved=false;
    const t=e.touches?.[0];if(!t)return;
    const x=t.clientX,y=t.clientY;
    timer=setTimeout(()=>{if(!moved)showReactionPicker(message,el)},520);
    el.__pressStart={x,y};
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    const t=e.touches?.[0];if(!t||!el.__pressStart)return;
    if(Math.abs(t.clientX-el.__pressStart.x)>10||Math.abs(t.clientY-el.__pressStart.y)>10){moved=true;clearTimeout(timer)}
  },{passive:true});
  ["touchend","touchcancel"].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer),{passive:true}));
  el.addEventListener("contextmenu",e=>{e.preventDefault();showChatActionMenu(message,el)});
}
function subscribeToMessages(forChatId){
  if(chatMessagesUnsub){try{chatMessagesUnsub()}catch(e){} chatMessagesUnsub=null}
  const expectedId=forChatId||selectedChatId;
  const me=currentUid();
  const other=selectedChatUser?.uid||"";
  if(!expectedId||!me||!other)return;

  const gen=++chatSubGen;
  knownMsgIds=new Set();
  lastMsgCount=0;

  const getHost=()=>document.getElementById("chatMessages");
  const host=getHost();
  if(!host)return;

  const q=query(collection(firestore,"chats",expectedId,"messages"),orderBy("createdAt","asc"),limit(200));
  chatMessagesUnsub=onSnapshot(q,snap=>{
    if(gen!==chatSubGen)return; // stale subscription
    if(selectedChatId!==expectedId)return;
    const h=getHost();
    if(!h)return;

    // Only real messages are rendered. Legacy/accidental documents with
    // missing or blank text must never appear as a timestamp-only bubble.
    const docs=snap.docs
      .filter(d=>messageBelongsToChat(d.data(), expectedId, me, other))
      .filter(d=>String(d.data()?.text??"").trim().length>0);

    if(!docs.length){
      h.innerHTML=`<div class="chat-empty"><strong>Messages exchanged with your friends will be displayed here.</strong></div>`;
      chatMessageCache=new Map();
      knownMsgIds=new Set();
      lastMsgCount=0;
      return;
    }

    let shouldSound=false;
    const initialMessageSnapshot = (lastMsgCount===0 && knownMsgIds.size===0);
    docs.forEach(d=>{
      const m=d.data();
      if(!initialMessageSnapshot && !knownMsgIds.has(d.id) && m.senderId!==me && lastMsgCount>0){
        shouldSound=true;
      }
      knownMsgIds.add(d.id);
    });
    if(shouldSound)playMessageSound();
    lastMsgCount=docs.length;
    // The currently open conversation is considered read immediately.
    const hasIncoming=docs.some(d=>d.data()?.senderId===other);
    if(hasIncoming)markChatRead(expectedId);

    chatMessageCache=new Map(docs.map(d=>[String(d.id),{id:d.id,...d.data()}]));
    h.innerHTML=docs.map(d=>{
      const m=d.data();
      const mine=m.senderId===me;
      const reply=m.replyTo;
      const reactions=m.reactions||{};
      const reactionHTML=Object.entries(reactions).filter(([_,ids])=>Array.isArray(ids)&&ids.length).map(([emoji,ids])=>{
        const reacted=ids.includes(currentUid());
        return `<button class="chat-reaction-chip ${reacted?"mine-reaction":""}" title="${reacted?"You reacted":"Reaction"}" onclick="reactToChatMessage('${esc(d.id)}','${esc(emoji)}');event.stopPropagation()">${emoji} ${ids.length}</button>`;
      }).join("");
      const replyHTML=reply?`<div class="chat-bubble-reply"><b>${esc(reply.senderName||"User")}</b><br>${escapeChatText(reply.text||"")}</div>`:"";
      const hoverActions=`<div class="chat-hover-actions" onmouseenter="event.stopPropagation()">
        <button title="React" onclick="openReactionPickerById('${esc(d.id)}',this);event.stopPropagation()">😊</button>
        <button class="hover-reply" title="Reply" onclick="setChatReplyById('${esc(d.id)}');event.stopPropagation()">↩</button>
        ${mine?`<button class="hover-delete" title="Delete" onclick="deleteChatMessage('${esc(d.id)}');event.stopPropagation()">🗑</button>`:""}
      </div>`;
      return `<div class="chat-bubble-row ${mine?"mine":""}" data-message-row="${esc(d.id)}"><div class="chat-bubble-wrap"><div class="chat-bubble" data-message-id="${esc(d.id)}">${replyHTML}${escapeChatText(m.text)}<div class="chat-bubble-time">${formatChatTime(m.createdAt)}</div></div>${hoverActions}${reactionHTML?`<div class="chat-reaction-line">${reactionHTML}</div>`:""}</div></div>`;
    }).join("");
    docs.forEach(d=>{
      const el=h.querySelector(`[data-message-id="${CSS.escape(d.id)}"]`);
      if(el){const m={id:d.id,...d.data()};bindChatMessagePress(el,m);}
    });
    h.scrollTop=h.scrollHeight;
  },err=>{
    if(gen!==chatSubGen)return;
    console.warn("Message listener failed",err);
    const h=getHost();
    if(h)h.innerHTML=`<div class="chat-empty">Messages could not load. Check your Firestore rules.</div>`;
  });
}
function handleChatKeydown(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChatMessage()}
}
async function sendChatMessage(){
  const input=document.getElementById("chatMessageInput");if(!input||!selectedChatUser||!currentUid()||!firestore)return;
  const text=input.value.trim();if(!text)return;
  if(chatBlockedByMe||chatBlockedMe){chatWarning("Messaging unavailable","You cannot send messages to this user right now.","🚫");return;}
  const otherUid=selectedChatUser.uid;
  const cid=chatIdFor(currentUid(),otherUid);
  selectedChatId=cid;
  if(!cid||!otherUid)return;
  const btn=document.getElementById("chatSendBtn");
  if(btn)btn.disabled=true;
  input.value="";
  try{
    const [mine,theirs]=await Promise.all([
      getDoc(doc(firestore,"blocks",`${currentUid()}_${otherUid}`)),
      getDoc(doc(firestore,"blocks",`${otherUid}_${currentUid()}`))
    ]);
    if(mine.exists||theirs.exists){await refreshBlockState(otherUid);renderChatWindow();subscribeToMessages(selectedChatId);if(btn)btn.disabled=false;chatWarning("Messaging unavailable","Messaging is unavailable because one of you has blocked the other.","🚫");return;}
    const chatRef=doc(firestore,"chats",cid);
    // Create/update chat first
    await setDoc(chatRef,{
      participants:[currentUid(),otherUid].sort(),
      lastMessage:text.slice(0,200),
      lastMessageSenderId:currentUid(),
      updatedAt:serverTimestamp(),
      createdAt:serverTimestamp()
    },{merge:true});
    // Then add message
    const replyTo=pendingChatReply?{
      id:pendingChatReply.id,
      text:pendingChatReply.text,
      senderId:pendingChatReply.senderId,
      senderName:pendingChatReply.senderName
    }:null;
    await addDoc(collection(firestore,"chats",cid,"messages"),{
      senderId:currentUid(),
      receiverId:otherUid,
      text,
      ...(replyTo?{replyTo}:{}),
      createdAt:serverTimestamp()
    });
    clearChatReply();
    setTypingStatus(false);
  }catch(err){
    console.error("Send message failed",err);
    alert("Message could not be sent. Please update Firestore rules (see latest rules).\n\nError: "+(err.message||err));
    input.value=text;
  }finally{
    if(btn)btn.disabled=false;
  }
}

/* Follow system: store each follower under the target public profile.
   This avoids the old top-level `follows` permission problem and lets the
   target profile expose follower/following data with simple rules. */
function followerRef(targetUid,followerUid=currentUid()){
  return doc(firestore,"publicProfiles",targetUid,"followers",followerUid);
}
async function toggleFollow(targetUid,btn){
  if(!firebaseReady||!currentUid()||targetUid===currentUid())return false;
  const ref=followerRef(targetUid);
  try{
    const existing=await getDoc(ref);
    if(existing.exists){
      await deleteDoc(ref);
      try{await deleteDoc(doc(firestore,"publicProfiles",currentUid(),"following",targetUid))}catch(e){}
      await publishMyPublicProfile();
      if(btn){btn.textContent="Follow";btn.classList.remove("following")}
      return false;
    }else{
      await setDoc(ref,{followerId:currentUid(),followingId:targetUid,createdAt:serverTimestamp()},{merge:true});
      try{await setDoc(doc(firestore,"publicProfiles",currentUid(),"following",targetUid),{followingId:targetUid,createdAt:serverTimestamp()},{merge:true})}catch(e){}
      await publishMyPublicProfile();
      if(btn){btn.textContent="Following";btn.classList.add("following")}
      return true;
    }
  }catch(err){
    console.error("Follow update failed",err);
    if(btn){btn.textContent="Follow";btn.classList.remove("following")}
    alert("Could not update follow status. Please make sure the Firestore rules below are applied.");
    return false;
  }
}
async function isFollowing(targetUid){
  if(!firebaseReady||!currentUid()||targetUid===currentUid())return false;
  try{return (await getDoc(followerRef(targetUid,currentUid()))).exists}catch{return false}
}

let userProfileChart=null;
async function openUserProfile(uid){
  if(!firebaseReady||!uid)return;
  const u=await fetchPublicProfile(uid);if(!u){alert("This user profile could not be loaded.");return}
  const [followersSnap,followingSnap,following]=await Promise.all([
    getDocs(collection(firestore,"publicProfiles",uid,"followers")),
    getDocs(collection(firestore,"publicProfiles",uid,"following")).catch(()=>({size:0})),
    uid!==currentUid()?isFollowing(uid):false
  ]);
  const followingCount=followingSnap.size||Math.max(0,Number(u.followingCount)||0);
  const blockedMine=uid!==currentUid()?(await getDoc(doc(firestore,"blocks",`${currentUid()}_${uid}`))).exists:false;
  const totalStudySeconds=Math.max(0,Number(u.totalSeconds)||0);
  const breakdown=Array.isArray(u.subjectBreakdown)?u.subjectBreakdown:[];
  const topSubject=u.topSubject||breakdown[0]?.name||"No subject yet";
  document.getElementById("modalHost").innerHTML=`<div class="chat-profile-modal" onclick="if(event.target===this)closeUserProfile()"><section class="chat-profile-box chat-profile-full">
    <button type="button" onclick="closeUserProfile()" class="close-round" style="position:absolute;right:18px;top:18px;z-index:5">×</button>
    <div class="chat-profile-top">${chatAvatarHTML(u,"chat-profile-big-avatar")}<div class="chat-profile-name">${esc(u.name||"Study User")}</div><div class="chat-profile-handle">@${esc(u.username||"username")}</div><div class="chat-status ${u.studyStatus!=="Studying"?"offline":""}"><i data-lucide="${u.studyStatus==="Studying"?"book-open":"circle"}" style="width:12px;height:12px"></i>${u.studyStatus||"Available"}</div></div>
    <div class="chat-profile-stats"><div class="chat-profile-stat"><b id="profileFollowersCount">${followersSnap.size}</b><span>Followers</span></div><div class="chat-profile-stat"><b>${followingCount}</b><span>Following</span></div></div>
    <div class="chat-profile-bio">${esc(u.bio||"No bio yet.")}</div>
    <div class="chat-profile-study"><div class="chat-profile-study-head"><span class="chat-profile-study-title">STUDY TIME</span><span class="chat-profile-study-total">${fmt(totalStudySeconds)}</span></div><div class="chat-profile-chart"><canvas id="userProfileStudyChart"></canvas></div><div class="chat-profile-top-subject"><span>Most studied subject</span><b>${esc(topSubject)}</b></div></div>
    ${uid!==currentUid()?`<div class="chat-profile-actions"><button class="chat-profile-message" onclick="closeUserProfile();openChat('${esc(uid)}')">Message</button><button class="chat-profile-close" id="profileFollowBtn" onclick="toggleFollowFromProfile('${esc(uid)}',this)">${following?"Following":"Follow"}</button></div><button class="chat-profile-block" onclick="toggleBlockUser('${esc(uid)}',${blockedMine})">${blockedMine?"Unblock user":"Block user"}</button>`:`<div class="chat-profile-actions"><button class="chat-profile-close" style="grid-column:1/-1" onclick="closeUserProfile()">Close</button></div>`}
  </section></div>`;
  const chartEl=document.getElementById("userProfileStudyChart");
  if(userProfileChart){try{userProfileChart.destroy()}catch(e){}}
  if(chartEl&&breakdown.length){
    userProfileChart=new Chart(chartEl,{type:"doughnut",data:{labels:breakdown.map(x=>x.name),datasets:[{data:breakdown.map(x=>x.seconds),backgroundColor:breakdown.map((_,i)=>["#8f36c9","#ef2670","#e2c51a","#42c8ef","#54b95b","#ff9f43","#6c7cff","#9aa3ad"][i%8]),borderColor:"#fff",borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{legend:{position:"bottom",labels:{boxWidth:9,font:{size:9,weight:"700"},padding:8}},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.raw)}`}}}}});
  }
  if(window.lucide)lucide.createIcons();
}
function closeUserProfile(){if(userProfileChart){try{userProfileChart.destroy()}catch(e){}userProfileChart=null}const h=document.getElementById("modalHost");if(h)h.innerHTML=""}
async function toggleFollowFromProfile(uid,btn){await toggleFollow(uid,btn);await openUserProfile(uid)}
async function toggleBlockSelected(){if(selectedChatUser)await toggleBlockUser(selectedChatUser.uid,chatBlockedByMe)}
async function toggleBlockUser(uid,isBlocked){
  if(!currentUid()||!uid||uid===currentUid())return;
  const ref=doc(firestore,"blocks",`${currentUid()}_${uid}`);
  try{
    if(isBlocked)await deleteDoc(ref);else await setDoc(ref,{blockerId:currentUid(),blockedId:uid,createdAt:serverTimestamp()});
    if(selectedChatUser?.uid===uid){await refreshBlockState(uid);renderChatWindow();subscribeToMessages(selectedChatId)}
    openUserProfile(uid);
  }catch(err){console.error(err);alert("Could not update block status.")}
}

/* Better Google-like account chooser when using the local/demo mode. */

/* MOBILE PULL-TO-REFRESH — reload only when the page is at the top */
let pullStartY=null;
let pullTracking=false;
document.addEventListener("touchstart",e=>{
  if(window.innerWidth>700)return;
  if(window.scrollY>0)return;
  const touch=e.touches?.[0];
  if(!touch)return;
  pullStartY=touch.clientY;
  pullTracking=true;
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!pullTracking || window.innerWidth>700)return;
  const touch=e.changedTouches?.[0];
  const endY=touch?.clientY;
  const distance=(endY??pullStartY)-pullStartY;
  pullTracking=false;
  if(window.scrollY<=0 && distance>85){
    window.location.reload();
  }
},{passive:true});


// Keep the red Chats badge in sync whenever renderApp replaces the navigation.
try{
  const chatBadgeObserver=new MutationObserver(()=>{
    if(window.__chatBadgeObserverBusy)return;
    window.__chatBadgeObserverBusy=true;
    requestAnimationFrame(()=>{window.__chatBadgeObserverBusy=false;updateChatUnreadBadges()});
  });
  chatBadgeObserver.observe(document.getElementById("app"),{childList:true,subtree:true});
}catch(e){}

render();
